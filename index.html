let CLASSES=[];
function classBar(){
  return `<section class="class-bar"><div class="cb-head"><span class="eyebrow">📚 저장된 학급</span>
      <small>학급을 누르면 그 반의 모둠·문제·점수·입장 코드로 바뀌어요. 같은 링크로 여러 반에서 쓸 수 있어요.</small>
      <span class="sp"></span><button class="btn gold sm" onclick="newClassAsk()">＋ 새 학급</button></div>
    <div class="cls-list" data-live="classes">${classesInner()}</div></section>`;
}
function classesInner(){
  if(!CLASSES.length)return `<p class="cls-empty">아직 저장된 학급이 없어요. 아래 <b>기본 정보</b>에 학급 이름을 넣으면 여기에 저장돼요.</p>`;
  return CLASSES.map((c,i)=>{const on=CFG&&c.gameId===CFG.gameId;
    return `<div class="cls ${on?'on':''}"><button class="cls-main" onclick="switchClass(${i})" ${on?'disabled':''} title="${on?'지금 사용 중':esc(c.klass)+'으로 바꾸기'}">
      <b>${esc(c.klass)}</b><small>${on?'✔ 지금 사용 중':esc(c.phase||'준비')}${c.at?' · '+esc(c.at.slice(5,16).replace('-','/')):''}</small></button>
      <button class="cls-del" onclick="deleteClassAsk(${i})" title="${on?'사용 중인 학급은 지울 수 없어요':'학급 지우기'}" ${on?'disabled':''}>🗑</button></div>`}).join('');
}
async function flushSave(){if(saveT){clearTimeout(saveT);saveT=null;await saveCfgNow()}}
function afterGameChange(r,msg){
  CFG=r.config;if(r.classes)CLASSES=r.classes;
  ROOMS={};RECS=[];TDRAFT={};SCORES=[];STATUS={};ROOMS_REV=-1;ROOMS_KEY='';resetUI();UI.room=null;UI.awards=0;UI.makeSel=null;
  VIEW='setup';lsSet('gem.view','setup');LAST_SIG='';render();refresh();scrollTo({top:0,behavior:'smooth'});toast(msg,'good');
}
async function switchClass(i){
  const c=CLASSES[i];if(!c)return;
  if(!confirm(`‘${c.klass}’ 학급으로 바꿀까요?\n\n지금 학급(${CFG.klass||'이름 없음'})의 내용은 그대로 저장돼 있어요.\n바꾸면 학생들은 그 반의 입장 코드로 들어와야 해요.`))return;
  try{await flushSave();const r=await call('switchClass',{klass:c.klass});afterGameChange(r,`📚 ${c.klass} 학급으로 바꿨어요`)}catch(e){toast(e.message,'bad')}
}
function newClassAsk(){
  openModal(`<h3>＋ 새 학급</h3><p>지금 쓰는 출제 방식·모둠·규칙을 그대로 가져와서 새 학급을 만들어요. 문제·점수는 새로 시작하고, 입장 코드와 모둠 비밀번호도 새로 생겨요.<br>지금 학급(${esc(CFG.klass||'이름 없음')})은 그대로 저장돼 있어요.</p>
  <label class="lb">새 학급 이름</label><input class="inp" id="ng-klass" placeholder="예: 1학년 6반" onkeydown="if(event.key==='Enter')newClass()">
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn gold" onclick="newClass()">새 학급 만들기</button></div>`);
  setTimeout(()=>{const i=$('#ng-klass');if(i)i.focus()},50);
}
const newGameAsk=newClassAsk;
async function newClass(){
  const name=$('#ng-klass').value.trim();if(!name)return toast('학급 이름을 넣어 주세요');
  const ex=CLASSES.findIndex(c=>c.klass===name);
  if(ex>=0){closeModal();if(CLASSES[ex].gameId===CFG.gameId)return toast('지금 사용 중인 학급이에요');return switchClass(ex)}
  try{await flushSave();const c=clone(CFG);c.klass=name;const r=await call('newGame',{config:c});closeModal();afterGameChange(r,`＋ ${name} 학급을 만들었어요`)}catch(e){toast(e.message,'bad')}
}
function deleteClassAsk(i){
  const c=CLASSES[i];if(!c)return;
  openModal(`<h3>🗑 ‘${esc(c.klass)}’ 학급을 지울까요?</h3><p>저장된 학급 목록에서 빠져요. <b>점수판_${esc(c.klass)}</b> 탭의 점수 기록은 시트에 그대로 남아요.</p>
    <label style="display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:14px"><input type="checkbox" id="purge-cls"> 이 학급의 문제·사진·풀이 기록도 시트에서 지우기 (되돌릴 수 없어요)</label>
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn coral" onclick="deleteClass(${i})">지우기</button></div>`);
}
async function deleteClass(i){
  const c=CLASSES[i];const purge=!!($('#purge-cls')&&$('#purge-cls').checked);
  try{const r=await call('deleteClass',{klass:c.klass,purge});CLASSES=r.classes;closeModal();patch('classes',classesInner);toast(`🗑 ${c.klass} 학급을 지웠어요`,'good')}catch(e){toast(e.message,'bad')}
}
/* 학급 이름 칸: 다 쓰고 나서(칸을 벗어날 때) 저장. 이미 있는 학급 이름이면 그 학급으로 바꿀지 물어봐요 */
function setKlass(el){
  const v=el.value.trim(),prev=CFG.klass;if(v===prev)return;
  const ex=CLASSES.findIndex(c=>c.klass===v&&c.gameId!==CFG.gameId);
  if(ex>=0){el.value=prev;if(confirm(`‘${v}’ 학급은 이미 저장돼 있어요. 그 학급으로 바꿀까요?\n(지금 학급 이름은 그대로 둬요)`))switchClass(ex);return}
  CFG.klass=v;saveCfg(true);
}

function setBox(k,label,unit,small,min,max){return `<div class="set"><label>${label}</label><div class="row"><input type="number" min="${min}" max="${max}" value="${CFG.settings[k]}" onchange="setSetting('${k}',this.value,${min},${max})"><span>${unit}</span></div><small>${small}</small></div>`}
function setSetting(k,v,min,max){v=Math.max(min,Math.min(max,Math.round(+v||0)));CFG.settings[k]=v;if(k==='makeMin'&&!CFG.timer.running){CFG.timer.total=v*60;CFG.timer.remaining=v*60}saveCfg();render()}
function setMode(m){if(m===CFG.mode)return;CFG.mode=m;const T=targets(m);CFG.groups.forEach((g,i)=>g.target=T[i%T.length].key);saveCfg();render()}
function setG(id,k,v){byId(id)[k]=v;saveCfg();if(k==='target')render()}
function cycleEmoji(id){const g=byId(id);g.emoji=EMO[(EMO.indexOf(g.emoji)+1)%EMO.length];saveCfg();render()}
function setGroupCount(n){n=Math.max(2,Math.min(8,n));
  if(n<CFG.groups.length){const rm=CFG.groups.slice(n);if(rm.some(g=>STATUS[g.id]&&STATUS[g.id].count)&&!confirm('줄어드는 모둠이 이미 문제를 보냈어요. 그래도 줄일까요?'))return;CFG.groups=CFG.groups.slice(0,n)}
  while(CFG.groups.length<n)CFG.groups.push(newGroup(CFG.groups.length,CFG.mode));saveCfg();render()}
function shuffleTargets(){const T=[...targets(CFG.mode)].sort(()=>Math.random()-.5);CFG.groups.forEach((g,i)=>g.target=T[i%T.length].key);saveCfg();render();sfx.click();toast('🎲 담당을 랜덤으로 정했어요!')}
function startMaking(){CFG.phase='make';CFG.timer={total:CFG.settings.makeMin*60,remaining:CFG.settings.makeMin*60,running:false,endAt:0};saveCfg(true);UI.makeSel=CFG.groups[0].id;goView('make');toast('✍️ 학생 기기에서 문제 만들기가 열렸어요','good')}

async function joinGroupPin(gid){
  const i=$('#gpin-in');const pin=(i.value||'').replace(/\D/g,'');if(pin.length!==4)return toast('숫자 4자리를 입력해 주세요');

/* ================= 타이머 ================= */
function remain(){const t=CFG&&CFG.timer;if(!t)return 0;return t.running?Math.max(0,(t.endAt-now())/1000):t.remaining}
function fmt(sec){sec=Math.ceil(sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function tToggle(){const t=CFG.timer;if(t.running){t.remaining=remain();t.running=false}else{if(t.remaining<=0)t.remaining=t.total;t.running=true;t.endAt=now()+t.remaining*1000;sfx.click()}saveCfg(true);updateTimerDom();renderBigCtrl()}
function tAdd(min){const t=CFG.timer;if(t.running)t.endAt=Math.max(now(),t.endAt+min*60000);else t.remaining=Math.max(0,t.remaining+min*60);t.total=Math.max(60,t.total+min*60);saveCfg(true);updateTimerDom()}
function tReset(){CFG.timer={total:CFG.settings.makeMin*60,remaining:CFG.settings.makeMin*60,running:false,endAt:0};saveCfg(true);updateTimerDom();renderBigCtrl()}
function updateTimerDom(){
  if(!CFG)return;const t=CFG.timer,r=remain(),urgent=r<=60&&r>0;
  document.querySelectorAll('[data-timer]').forEach(el=>{el.textContent=fmt(r);el.classList.toggle('urgent',urgent)});
  document.querySelectorAll('[data-timer-bar]').forEach(el=>{el.style.width=(t.total?r/t.total*100:0)+'%';el.parentElement.classList.toggle('urgent',r<=300)});
  document.querySelectorAll('[data-timer-toggle]').forEach(el=>el.textContent=t.running?'⏸ 일시정지':(t.remaining<t.total&&t.remaining>0?'▶ 계속':'▶ 시작'));
  document.querySelectorAll('[data-timer-state]').forEach(el=>el.textContent=t.running?'⏳ 진행 중':(r<=0?'⏰ 시간 끝!':'⏸ 멈춤'));
  $('#hdr-timer').hidden=!(t.running&&CFG.phase==='make'&&curView()!=='make');
  const qe=document.querySelector('[data-qtimer]');
  if(qe){const qr=QTM.running?Math.max(0,(QTM.endAt-Date.now())/1000):QTM.remaining;qe.textContent=QTM.done?'⏰ 시간 끝!':'⏱ '+fmt(qr);qe.classList.toggle('urgent',qr<=10||QTM.done)}
}
let QTM={remaining:0,running:false,endAt:0,done:false};
setInterval(()=>{
  if(CFG&&isT()&&CFG.timer.running&&remain()<=0){CFG.timer.running=false;CFG.timer.remaining=0;saveCfg(true);sfx.alarm();timeUp()}
  if(QTM.running){const qr=(QTM.endAt-Date.now())/1000;if(qr<=0){QTM.running=false;QTM.remaining=0;QTM.done=true;sfx.wrong()}else if(qr<=5&&Math.ceil(qr)!==QTM.last){QTM.last=Math.ceil(qr);sfx.tick()}}
  updateTimerDom();
},250);
function timeUp(){openModal(`<div class="timeup"><div class="t-ico">⏰</div><h3>문제 만들기 시간 끝!</h3><p>모둠마다 <b>📨 선생님께 전송</b>을 눌렀는지 확인해 주세요.<br>모두 보냈다면 출제를 마감하고 방탈출을 시작해요.</p>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><span class="t-step light"><input type="number" min="1" max="120" value="${tStep()}" data-tstep onchange="setTStep(this.value)"><span>분</span></span><button class="btn ghost" onclick="const m=readTStep();tAdd(m);tToggle();closeModal();toast('⏱ '+m+'분 연장했어요','good')">연장하고 다시 시작</button><button class="btn gold" onclick="closeModal();closeBigTimer();closeMaking()">🔒 출제 마감하기</button></div></div>`)}
function openBigTimer(){if(!CFG)return;$('#bigtimer').classList.remove('join-mode');$('#bt-title').textContent=(CFG.title||'지리 방탈출')+' · 문제 만들기 시간';
  $('#bt-groups').innerHTML=CFG.groups.map(g=>{const s=STATUS[g.id]||{};return `<span>${g.emoji} ${esc(g.name)} · ${targetOf(g).emoji} ${targetOf(g).name} <b>${s.count||0}/${CFG.settings.goal}</b></span>`}).join('');
  renderBigCtrl();$('#bigtimer').hidden=false;updateTimerDom()}
function renderBigCtrl(){$('#bt-ctrl').innerHTML=(isT()?`<button class="btn gold big" data-timer-toggle onclick="tToggle()">▶ 시작</button>${stepCtrl('big')}`:'')+`<button class="btn glass big" onclick="closeBigTimer()">✕ 닫기</button>`;updateTimerDom()}
/* 시간 더하기·빼기: 선생님이 분을 입력하고 ＋/− */
function tStep(){const v=parseInt(lsGet('gem.tstep'),10);return v>=1&&v<=120?v:5}
function setTStep(v){v=Math.max(1,Math.min(120,parseInt(v,10)||1));lsSet('gem.tstep',String(v));document.querySelectorAll('[data-tstep]').forEach(i=>{if(i!==document.activeElement)i.value=v});return v}
function readTStep(){const i=document.activeElement&&document.activeElement.matches&&document.activeElement.matches('[data-tstep]')?document.activeElement:document.querySelector('[data-tstep]');return setTStep(i?i.value:tStep())}
function stepAdd(sign){const m=readTStep();tAdd(sign*m);toast(`⏱ ${sign>0?'＋':'−'} ${m}분`)}
function stepCtrl(size){return `<div class="t-step ${size||''}" title="더하거나 뺄 시간(분)을 입력하세요">
  <button class="btn glass ${size?'':'sm'}" onclick="stepAdd(-1)" aria-label="시간 빼기">−</button>
  <input type="number" min="1" max="120" value="${tStep()}" data-tstep onchange="setTStep(this.value)" onkeydown="if(event.key==='Enter')stepAdd(1)" aria-label="분"><span>분</span>
  <button class="btn glass ${size?'':'sm'}" onclick="stepAdd(1)" aria-label="시간 더하기">＋</button></div>`}
function closeBigTimer(){$('#bigtimer').hidden=true}

function tipsBox(){return `<div class="side-box"><h4>✨ 좋은 문제 만드는 팁</h4><ul>
  <li>위치·기후·지형·문화·산업을 골고루!</li><li>정답이 하나로 딱 떨어지게 만들기</li>
  <li>단답형은 인정할 답을 쉼표로 모두 적기<br><small>예) 히말라야, 히말라야산맥</small></li>

async function closeMaking(){
  const none=CFG.groups.filter(g=>!(STATUS[g.id]||{}).count);
  if(!confirm(`출제를 마감할까요?${none.length?`\n\n아직 문제를 보내지 않은 모둠: ${none.map(g=>g.name).join(', ')}`:''}\n\n마감하면 학생 기기에서 ③ 방탈출이 열려요.`))return;
  CFG.phase='play';if(CFG.timer.running){CFG.timer.remaining=remain();CFG.timer.running=false}
  await saveCfgNow();UI.room=null;goView('play');sfx.fanfare();toast('🔓 학생 기기에서 방탈출이 시작됐어요!','good');
}
async function reopenMaking(){if(!confirm('출제를 다시 열까요? 학생 기기의 방탈출 화면이 닫히고 문제 만들기로 돌아가요.'))return;CFG.phase='make';await saveCfgNow();render()}

/* 학생 문제 만들기 */

  const g=byId(myGroup()),t=targetOf(g);

  return `<div class="page">
  <section class="timer-panel" style="grid-template-columns:1fr auto">
    <div><span class="eyebrow">STEP 2 · 문제 만들기</span><h2>${g.emoji} ${esc(g.name)}의 ${t.name} 방</h2>
      <p>자물쇠(문제)를 <b>${CFG.settings.goal}개</b> 이상 만들고 <b>📨 선생님께 전송</b>을 눌러 주세요. 여러 번 보내도 마지막에 보낸 것이 저장돼요.</p></div>
    <div class="timer-box"><div class="timer-digits" data-timer>00:00</div><div class="timer-bar"><i data-timer-bar></i></div><p style="margin-top:6px" data-timer-state></p></div>
  </section>
  <div class="make-grid stu"><aside class="side">${tipsBox()}
    <div class="side-box"><h4>💡 여러 기기로 함께 만들기</h4><p>모둠 친구들이 각자 기기에서 자물쇠를 만들어 <b>📨 전송</b>하면, 시트에서 <b>올라온 순서대로 합쳐져요.</b> 친구가 보낸 자물쇠를 보려면 <b>☁️ 모둠 문제 불러오기</b>를 누르세요. 순서는 <b>↕ 순서 바꾸기</b>로 정리한 뒤 다시 전송하면 돼요.</p></div></aside>
  <section class="editor">${renderEditor(g.id)}</section></div></div>`;
}

/* ----- 편집기 (교사·학생 공용) ----- */
function draftKey(gid){return 'gem.draft.'+CFG.gameId+'.'+gid}
function getDraft(gid){gid=gid||myGroup();try{return JSON.parse(lsGet(draftKey(gid))||'null')}catch(e){return null}}
function putDraft(d,gid){gid=gid||myGroup();if(!lsSet(draftKey(gid),JSON.stringify(d)))toast('이 기기의 저장 공간이 부족해요. 사진 크기를 줄여 주세요.','bad')}
function emptyRoom(){return{title:'',story:'',questions:[],_dirty:false}}
function edGet(gid){if(isT())return TDRAFT[gid]||ROOMS[gid]||emptyRoom();return getDraft(gid)||emptyRoom()}
function edMut(gid,fn){
  if(isT()){if(!TDRAFT[gid])TDRAFT[gid]=clone(ROOMS[gid]||emptyRoom());fn(TDRAFT[gid]);TDRAFT[gid]._dirty=true;patch('gtabs',gtabsInner)}
  else{const d=getDraft(gid)||emptyRoom();fn(d);d._dirty=true;putDraft(d,gid)}
  refreshSendBar(gid);
}
function renderEditor(gid){
  const g=byId(gid),t=targetOf(g),room=edGet(gid),qs=room.questions;
  return `<div class="ed-head" style="--c:${t.color}"><div class="ed-badge">${t.emoji}</div>
    <div><span class="eyebrow">${g.emoji} ${esc(g.name)}의 탈출 방</span><h2>${t.name} 방</h2></div></div>
  <div class="send-bar" id="send-bar">${sendBarInner(gid)}</div>
  <div class="card room-meta"><div class="two">
    <div><label class="lb" style="margin-top:0">🏷️ 방 이름</label><input class="inp" value="${esc(room.title)}" placeholder="예: ${t.name}의 잃어버린 지도" oninput="edMut('${gid}',r=>r.title=this.value)"></div>
    <div><label class="lb" style="margin-top:0">📖 방 이야기 (입장할 때 보여 줘요)</label><textarea class="inp" rows="2" placeholder="예: 탐험대가 ${t.name}의 비밀 유적에 갇혔다! 자물쇠를 모두 열어야 탈출할 수 있다…" oninput="edMut('${gid}',r=>r.story=this.value)">${esc(room.story)}</textarea></div>
  </div></div>
  ${qs.length?qs.map((q,i)=>renderQEdit(gid,q,i,t)).join(''):`<div class="empty-q">아직 자물쇠가 없어요. 아래에서 문제 유형을 골라 첫 자물쇠를 만들어 보세요! 🔒</div>`}
  <div class="add-row"><div class="lbl"><span>＋ 자물쇠 추가 <small>${qs.length} / ${CFG.settings.goal}개 (권장)</small></span>${qs.length>1?`<button class="btn glass sm" onclick="openOrder('${gid}')">↕ 순서 바꾸기</button>`:''}</div>
    ${Object.entries(QT).map(([k,v])=>`<button onclick="addQ('${gid}','${k}')"><span>${v.icon}</span>${v.label}</button>`).join('')}</div>`;
}
function sendBarInner(gid){
  const room=edGet(gid),n=room.questions.length,bad=room.questions.filter(q=>qWarn(q)).length;
  if(isT()){const s=STATUS[gid]||{};
    return `<div class="st ${TDRAFT[gid]?'st-warn':'st-ok'}">${TDRAFT[gid]?'✏️ 선생님이 고친 내용이 아직 저장되지 않았어요':s.count?`✅ 시트에 저장된 자물쇠 ${s.count}개`:'아직 이 모둠이 보낸 문제가 없어요'}<small>${s.at?'마지막 저장 '+s.at:''}${bad?` · ⚠ 미완성 ${bad}개`:''}</small></div>
      ${TDRAFT[gid]?`<button class="btn ghost sm" onclick="discardT('${gid}')">↺ 되돌리기</button>`:''}<button class="btn gold" onclick="sendRoom('${gid}')" ${n?'':'disabled'}>💾 시트에 저장</button>`}
  const s=STATUS[gid]||{},fresh=newFromOthers();
  return `<div class="st ${room._dirty?'st-warn':(s.count?'st-ok':'')}">${room._dirty?'✏️ 아직 보내지 않은 변경이 있어요':s.count?`✅ 우리 모둠 자물쇠 ${s.count}개가 선생님께 가 있어요`:'아직 보내지 않았어요'}
    <small>${s.at?'마지막 전송 '+s.at.slice(11):'만든 내용은 이 기기에 자동 저장돼요'}${bad?` · ⚠ 미완성 자물쇠 ${bad}개`:''}</small>
    ${fresh?`<span class="fresh">📥 친구가 다른 기기로 보낸 자물쇠 ${fresh}개가 있어요 → ☁️ 불러오기</span>`:''}</div>
    <button class="btn ${fresh?'mint':'ghost'} sm" onclick="loadServerCopy()">☁️ 모둠 문제 불러오기</button>
    <button class="btn gold big" id="send-btn" onclick="sendRoom('${gid}')" ${n||(room._base||[]).length?'':'disabled'}>📨 선생님께 전송</button>`;
}
/** 시트에는 있는데 이 기기는 아직 모르는 자물쇠 수 (친구가 다른 기기에서 보낸 것) */
function newFromOthers(){if(!MYSERVER)return 0;const d=getDraft()||emptyRoom();const known=new Set([...(d._base||[]),...d.questions.map(q=>q.id)]);return MYSERVER.questions.filter(q=>!known.has(q.id)).length}
function refreshSendBar(gid){const el=$('#send-bar');if(el)el.innerHTML=sendBarInner(gid)}
function qWarn(q){
  if(!String(q.prompt||'').trim())return '문제 내용이 비어 있어요';
  if(q.type==='mc'){if(q.options.filter(o=>String(o).trim()).length<2)return '보기를 2개 이상 써 주세요';if(q.answer===''||!String(q.options[+q.answer]||'').trim())return '정답 보기를 골라 주세요'}
  else if(q.type==='ox'){if(!['O','X'].includes(oxNorm(q.answer)))return 'O 또는 X 정답을 눌러 주세요'}
  else if(q.type==='code'){if(!String(q.answer).replace(/\D/g,''))return '숫자 비밀번호를 정해 주세요'}
  else if(!String(q.answer||'').trim())return '정답을 정해 주세요';
  return '';
}
function renderQEdit(gid,q,i,t){
  const id=q.id,w=qWarn(q);let ans='';
  if(q.type==='mc')ans=`<label class="lb">보기 <span style="font-weight:400">— 왼쪽 번호를 눌러 정답 표시</span></label><div class="opts">${q.options.map((o,k)=>`
    <div class="opt ${String(q.answer)===String(k)?'on':''}"><button class="mark" title="정답으로 표시" onclick="setQ('${gid}','${id}','answer','${k}',true)">${String(q.answer)===String(k)?'✓':CIRC[k]}</button>
    <input value="${esc(o)}" placeholder="보기 ${k+1}" oninput="setOpt('${gid}','${id}',${k},this.value)"></div>`).join('')}</div>`;
  else if(q.type==='ox'){const a=oxNorm(q.answer);ans=`<label class="lb">정답 (꼭 눌러 주세요)</label><div class="ox-pick"><button class="${a==='O'?'on':''}" onclick="setQ('${gid}','${id}','answer','O',true)">O</button><button class="${a==='X'?'on':''}" onclick="setQ('${gid}','${id}','answer','X',true)">X</button>${a!=='O'&&a!=='X'?'<span class="need">👈 정답이 O인지 X인지 눌러 주세요</span>':''}</div>`}
  else if(q.type==='short')ans=`<label class="lb">정답 <span style="font-weight:400">— 인정할 답이 여러 개면 쉼표(,)로 구분</span></label><input class="inp" value="${esc(q.answer)}" placeholder="예: 사하라, 사하라 사막" oninput="setQ('${gid}','${id}','answer',this.value)">`;
  else ans=`<label class="lb">자물쇠 비밀번호 (숫자)</label><input class="inp" inputmode="numeric" style="font-family:var(--display);font-size:24px;letter-spacing:.3em" value="${esc(q.answer)}" placeholder="예: 325" oninput="this.value=this.value.replace(/[^0-9]/g,'');setQ('${gid}','${id}','answer',this.value)">
    <p class="help">여러 문제의 답(숫자)을 이어 붙이거나, 글자 수·순서를 숫자로 바꿔 비밀번호를 만들어요.</p>`;
  const imgVal=q.image&&/^https?:/.test(q.image)?q.image:'';
  return `<div class="q-card" style="--c:${t.color}">
    <div class="q-head"><span class="lock-no"><i>🔒</i>자물쇠 ${i+1}</span>
      <div class="seg">${Object.entries(QT).map(([k,v])=>`<button class="${q.type===k?'on':''}" onclick="setType('${gid}','${id}','${k}')">${v.label}</button>`).join('')}</div>
      <span class="sp"></span><span data-qstat="${id}" class="${w?'warn':'ok-tag'}">${w?'⚠ '+w:'✓ 완성'}</span>
      <button class="mini" title="위로" onclick="moveQ('${gid}',${i},-1)">↑</button><button class="mini" title="아래로" onclick="moveQ('${gid}',${i},1)">↓</button><button class="mini" title="삭제" onclick="delQ('${gid}','${id}')">🗑</button></div>
    <label class="lb">문제</label>
    <textarea class="inp" rows="2" placeholder="${q.type==='ox'?'예: 나일강은 지중해로 흘러간다.':q.type==='code'?'예: 오대호는 모두 몇 개일까?':'예: 세계에서 가장 높은 산 에베레스트산이 있는 산맥은?'}" oninput="setQ('${gid}','${id}','prompt',this.value)">${esc(q.prompt)}</textarea>
    ${ans}
    <div class="grid-2">
      <div><label class="lb">💡 힌트 (선택)</label><input class="inp" value="${esc(q.hint)}" placeholder="정답 대신 단서를 주세요" oninput="setQ('${gid}','${id}','hint',this.value)"></div>
      <div><label class="lb">⭐ 점수 (비우면 ${CFG.settings.points}점)</label><input class="inp" type="number" min="1" max="100" value="${esc(q.points)}" placeholder="${CFG.settings.points}" oninput="setQ('${gid}','${id}','points',this.value)"></div>
    </div>
    <label class="lb">🖼️ 사진·지도 (선택)</label>
    <div class="img-row"><input class="inp" value="${esc(imgVal)}" placeholder="${q.image&&!imgVal?'(올린 사진 사용 중)':'이미지 주소(URL) 붙여넣기'}" onchange="setQ('${gid}','${id}','image',this.value.trim(),true)">
      <label class="btn ghost sm" style="cursor:pointer">📷 사진 올리기<input type="file" accept="image/*" hidden onchange="uploadImg('${gid}','${id}',this)"></label>
      ${q.image?`${imgTag(q,'thumb')}<button class="mini" title="사진 빼기" onclick="setQ('${gid}','${id}','image','',true)">✕</button>`:''}</div>
  </div>`;
}
function findQ(room,id){return room.questions.find(q=>q.id===id)}
function rerenderEditor(gid){if(isT())patch('editor',()=>renderEditor(gid));else{const y=scrollY;render();scrollTo(0,y)}}
function setQ(gid,id,k,v,re){edMut(gid,r=>{findQ(r,id)[k]=v});if(re)rerenderEditor(gid);else refreshWarn(gid,id)}
function setOpt(gid,id,k,v){edMut(gid,r=>{findQ(r,id).options[k]=v});refreshWarn(gid,id)}
function refreshWarn(gid,id){const el=document.querySelector(`[data-qstat="${id}"]`);if(!el)return;const w=qWarn(findQ(edGet(gid),id));el.className=w?'warn':'ok-tag';el.textContent=w?'⚠ '+w:'✓ 완성'}
function setType(gid,id,type){edMut(gid,r=>{const q=findQ(r,id);if(q.type===type)return;const prev=q.type,old=String(q.answer??'');q.type=type;
  if(type==='ox')q.answer=['O','X'].includes(oxNorm(old))?oxNorm(old):'';
  else if(type==='code')q.answer=prev==='mc'?'':old.replace(/\D/g,'');
  else if(type==='short')q.answer=prev==='mc'?'':old;
  else q.answer=''});rerenderEditor(gid)}
function addQ(gid,type){edMut(gid,r=>r.questions.push({id:uid('q'),type,prompt:'',image:'',options:['','','',''],answer:'',hint:'',points:''}));sfx.click();rerenderEditor(gid);
  setTimeout(()=>{const c=document.querySelectorAll('.q-card');const last=c[c.length-1];if(last){last.scrollIntoView({behavior:'smooth',block:'center'});last.querySelector('textarea').focus()}},60)}
function delQ(gid,id){if(!confirm('이 자물쇠(문제)를 지울까요?'))return;edMut(gid,r=>r.questions=r.questions.filter(q=>q.id!==id));rerenderEditor(gid)}
function moveQ(gid,i,d,quiet){edMut(gid,r=>{const a=r.questions,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]});if(!quiet)rerenderEditor(gid)}
/* ↕ 순서 바꾸기 창 */
function orderList(gid){const qs=edGet(gid).questions;return qs.map((q,i)=>`<div class="ord-row"><span class="ord-no">${i+1}</span><span>${QT[q.type].icon}</span>
  <span class="ord-txt">${esc(String(q.prompt||'(문제 내용 없음)').slice(0,48))}</span>
  <button class="mini" title="맨 위로" onclick="moveTo('${gid}',${i},0)" ${i?'':'disabled'}>⤒</button>
  <button class="mini" title="위로" onclick="moveQ('${gid}',${i},-1,true);refreshOrder('${gid}')" ${i?'':'disabled'}>▲</button>
  <button class="mini" title="아래로" onclick="moveQ('${gid}',${i},1,true);refreshOrder('${gid}')" ${i<qs.length-1?'':'disabled'}>▼</button></div>`).join('')}
function refreshOrder(gid){const el=$('#ord-list');if(el)el.innerHTML=orderList(gid)}
function moveTo(gid,i,to){edMut(gid,r=>{const [q]=r.questions.splice(i,1);r.questions.splice(to,0,q)});refreshOrder(gid)}
function openOrder(gid){openModal(`<h3>↕ 자물쇠 순서 바꾸기</h3><p>▲▼로 순서를 바꾸세요. 방탈출에서 이 순서대로 자물쇠가 나와요.<br>${isT()?'다 바꾼 뒤 <b>💾 시트에 저장</b>을 눌러야 반영돼요.':'다 바꾼 뒤 <b>📨 선생님께 전송</b>을 눌러야 친구들과 선생님께 반영돼요.'}</p>
  <div id="ord-list" class="ord-list">${orderList(gid)}</div><div style="text-align:right;margin-top:14px"><button class="btn gold" onclick="closeModal()">완료</button></div>`,'',()=>rerenderEditor(gid))}
/* 교사: 모둠 비밀번호 보기 · 쪽지 인쇄 */
function openPins(){
  const rows=CFG.groups.map(g=>{const t=targetOf(g);return `<div class="pin-slip"><div class="ps-g">${g.emoji} ${esc(g.name)}</div><div class="ps-t">${t.emoji} ${t.name} 담당</div><div class="ps-pin">${g.pin||'----'}</div><div class="ps-help">입장 코드 ${CFG.joinCode||''} → 우리 모둠 → 이 비밀번호</div></div>`}).join('');
  openModal(`<h3>🔒 모둠 비밀번호</h3><p>잘라서 모둠마다 한 장씩 나눠 주세요. 칠판(프로젝터)에는 띄우지 마세요.</p>
    <div id="cert"><div class="pin-grid">${rows}</div></div>
    <div class="cert-actions"><button class="btn ghost sm" onclick="regenPins()">🔄 모든 모둠 비밀번호 새로 만들기</button><button class="btn ink" onclick="window.print()">🖨️ 인쇄하기</button></div>`,'wide');
}
async function regenPins(){if(!confirm('모든 모둠 비밀번호를 새로 만들까요? 이미 들어와 있는 학생들은 새 비밀번호를 다시 입력해야 해요.'))return;
  try{const r=await call('newGroupPin',{});CFG.groups.forEach(g=>{const s=r.config.groups.find(x=>x.id===g.id);if(s)g.pin=s.pin});openPins();render();toast('🔒 새 모둠 비밀번호를 만들었어요','good')}catch(e){toast(e.message,'bad')}}
function uploadImg(gid,id,input){
  const f=input.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    let out='';for(const max of [900,720,560,440,340,260])for(const qv of [.8,.65,.5]){const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',qv);if(out.length<45000)break}
    if(out.length>=45000)return toast('사진이 너무 커요. 다른 사진을 골라 주세요','bad');
    setQ(gid,id,'image',out,true);toast('🖼️ 사진을 넣었어요','good')};img.onerror=()=>toast('사진을 읽을 수 없어요','bad');img.src=rd.result};
  rd.readAsDataURL(f);
}
function imgTag(q,cls){if(!q.image)return '';if(q.image==='@img')return `<img class="${cls}" data-img="${q.id}" alt="">`;return `<img class="${cls}" src="${esc(q.image)}" alt="" onerror="this.style.display='none'">`}
function loadImages(){document.querySelectorAll('img[data-img]').forEach(async el=>{const id=el.dataset.img;el.removeAttribute('data-img');
  if(IMG[id]){el.src=IMG[id];return}try{const r=await call('getImage',{qid:id});if(r.data){IMG[id]=r.data;el.src=r.data}}catch(e){}})}
async function sendRoom(gid){
  const room=edGet(gid);const bad=room.questions.map((q,i)=>[i,qWarn(q)]).filter(x=>x[1]);
  if(bad.length)return openModal(`<h3>⚠️ 아직 완성되지 않은 자물쇠가 있어요</h3><p>아래 자물쇠를 고친 뒤 다시 보내 주세요.</p><ul class="warn-list">${bad.map(([i,w])=>`<li>자물쇠 ${i+1}: ${w}</li>`).join('')}</ul><div style="text-align:right"><button class="btn gold" onclick="closeModal()">고치러 가기</button></div>`);
  const btn=$('#send-btn');if(btn){btn.disabled=true;btn.textContent='보내는 중…'}
  try{
    const payload={title:room.title,story:room.story,questions:room.questions.map(q=>({id:q.id,type:q.type,prompt:q.prompt,options:q.options,answer:q.type==='ox'?oxNorm(q.answer):q.answer,hint:q.hint,points:q.points,image:q.image}))};
    // base: 이 기기가 알고 있던 시트의 자물쇠들 → 서버가 다른 기기에서 보낸 것과 합쳐요
    const base=isT()?((ROOMS[gid]||{questions:[]}).questions.map(q=>q.id)):(room._base||[]);
    const before=room.questions.length;
    const r=await call('submitRoom',{group:gid,room:payload,base});
    room.questions.forEach(q=>{if(q.image&&q.image.startsWith('data:')){IMG[q.id]=q.image}});
    STATUS[gid]={count:r.count,at:r.submittedAt};
    const merged=r.room||Object.assign(clone(payload),{submittedAt:r.submittedAt});
    if(isT()){delete TDRAFT[gid];ROOMS[gid]=merged;patch('gtabs',gtabsInner);patch('editor',()=>renderEditor(gid));patch('status',statusInner)}
    else{putDraft(Object.assign(clone(merged),{_dirty:false,_base:merged.questions.map(q=>q.id)}),gid);MYSERVER=clone(merged);const y=scrollY;render();scrollTo(0,y)}
    const extra=r.count-before;
    sfx.right();toast(`📨 ${isT()?'시트에 저장':'선생님께 전송'}했어요! 우리 모둠 자물쇠 ${r.count}개${extra>0?` (친구가 보낸 ${extra}개 합쳐짐)`:''}`,'good');refresh();
  }catch(e){toast('보내지 못했어요: '+e.message,'bad');refreshSendBar(gid)}
}
function discardT(gid){if(!confirm('고친 내용을 버리고 시트에 저장된 버전으로 돌아갈까요?'))return;delete TDRAFT[gid];patch('gtabs',gtabsInner);patch('editor',()=>renderEditor(gid))}
/** ☁️ 모둠 문제 불러오기: 시트에 올라온 순서대로 가져오고, 이 기기에서 새로 만든(아직 안 보낸) 자물쇠는 뒤에 붙여요 */
async function loadServerCopy(){
  ROOMS_REV=-1;ROOMS_KEY='';await refresh();
  if(!MYSERVER||!MYSERVER.questions.length)return toast('아직 우리 모둠이 보낸 문제가 없어요. 먼저 📨 전송해 주세요');
  const d=getDraft()||emptyRoom(),srv=clone(MYSERVER),srvIds=srv.questions.map(q=>q.id),base=d._base||[];
  const localNew=d.questions.filter(q=>!srvIds.includes(q.id)&&!base.includes(q.id));      // 이 기기에서 새로 만든 것
  const localEdited=d._dirty&&d.questions.some(q=>srvIds.includes(q.id));
  if(localEdited&&!confirm('이 기기에서 고쳤지만 아직 안 보낸 내용은 시트에 있는 내용으로 바뀌어요.\n(이 기기에서 새로 만든 자물쇠는 그대로 남아요) 불러올까요?'))return;
  const nd={title:srv.title||d.title,story:srv.story||d.story,questions:[...srv.questions,...localNew],_base:srvIds,_dirty:localNew.length>0};
  putDraft(nd);const y=scrollY;render();scrollTo(0,y);
  toast(`☁️ 모둠 문제 ${srv.questions.length}개를 올라온 순서대로 불러왔어요${localNew.length?` · 이 기기의 새 자물쇠 ${localNew.length}개는 뒤에 있어요`:''}`,'good');
}

    ['africa','사하라의 모래시계','모래시계의 모래가 다 떨어지기 전에 탈출하라!',[
      Q('short','아프리카 북부에 있는, 세계에서 가장 넓은 \'더운 사막\'은?','사하라, 사하라사막, 사하라 사막','"사막"이라는 뜻의 아랍어에서 온 이름'),

/* ================= 3. 방탈출 — 공통 ================= */
const roomTitle=gid=>{const r=ROOMS[gid];return (r&&r.title)||targetOf(byId(gid)).name+'의 비밀 방'};
const roomGroups=()=>CFG.groups.filter(g=>ROOMS[g.id]&&ROOMS[g.id].questions.length);
const scoreOf=gid=>SCORES.find(x=>x.id===gid)||{ans:0,correct:0,stars:0,star:0,adj:0,total:0,rank:'-'};
function sbInner(){
  const max=Math.max(1,...SCORES.map(x=>x.total)),mine=isT()?null:myGroup();
  return SCORES.map(x=>{const g=byId(x.id);if(!g)return '';return `<div class="sb-row ${x.id===mine?'me':''}" style="--gc:${g.color}"><span class="sb-rank">${x.rank}</span><span class="sb-emoji">${g.emoji}</span>
    <span class="sb-name">${esc(g.name)}${x.id===mine?' (우리)':''}</span>
    <b class="sb-pts">${x.total}${isT()?`<span class="sb-adj"><button title="+5점" onclick="adj('${x.id}',5)">＋</button><button title="−5점" onclick="adj('${x.id}',-5)">−</button></span>`:''}</b>
    <span class="sb-bar"><i style="width:${Math.max(3,x.total/max*100)}%"></i></span></div>`}).join('')}
function scoreboard(){return `<aside class="scoreboard"><h3>🏅 실시간 점수판 <small><span class="live-dot"></span>LIVE</small></h3><div data-live="sb">${sbInner()}</div>
  <p class="sb-note">정답 점수 + 받은 별점 보너스${isT()?' + 선생님 조정(＋/− 5점)':''}<br>점수는 구글 시트 ‘점수판_${esc(CFG.klass||'학급미지정')}’ 탭에 기록돼요.</p></aside>`}
async function adj(gid,d){try{await call('adjust',{group:gid,delta:d});await refresh()}catch(e){toast(e.message,'bad')}}
function resetUI(){Object.assign(UI,{intro:false,sel:null,input:'',revealed:false,hint:false,picked:[],escaped:false,unlock:false,busy:false})}
function lockTrack(qs,qi,stateOf,doneRoom){return `<div class="lock-track">${qs.map((x,i)=>{const s=stateOf(x);return `<button class="lk ${s==='ok'?'open':s==='fail'?'fail':''} ${i===qi&&!UI.intro?'cur':''}" onclick="goQ(${i})"><span>${s==='ok'?'🔓':s==='fail'?'💥':'🔒'}</span><small>${i+1}</small></button>`}).join('<i class="lk-line"></i>')}<span class="lk-door">${doneRoom?'🚪✨':'🚪'}</span></div>`}
function introStage(gid,t,n){const g=byId(gid),r=ROOMS[gid];return `<div class="q-stage intro" style="--c:${t.color}"><div class="intro-emoji">${t.emoji}</div>

function starsHTML(gid,st){return `<div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=st?'on':''}" onclick="rate('${gid}',${n})">★</button>`).join('')}</div><div class="rate-msg">${st?`✅ 별 ${st}개를 줬어요`:'별을 눌러 주세요'}</div>`}
/* 별점: 누르는 즉시 화면에 반영하고, 저장은 뒤에서 (여러 번 눌러도 마지막 것만 저장) */
let rateT=null;
function paintStars(n,msg){document.querySelectorAll('.escape-card .stars button').forEach((b,i)=>b.classList.toggle('on',i<n));const m=document.querySelector('.escape-card .rate-msg');if(m)m.textContent=msg}
function rate(gid,n){
  MYRECS=MYRECS.filter(x=>!(x.t==='star'&&x.r===gid)).concat([{t:'star',s:myGroup(),r:gid,q:'',c:false,p:n,a:0,h:false,src:'student'}]);
  sfx.click();paintStars(n,`⭐ 별 ${n}개 · 저장하는 중…`);
  clearTimeout(rateT);rateT=setTimeout(()=>sendRate(gid,n,false),350);
}
function tRate(gid,n){
  RECS=RECS.filter(x=>!(x.t==='star'&&x.s==='teacher'&&x.r===gid)).concat([{t:'star',s:'teacher',r:gid,q:'',c:false,p:n,a:0,h:false,src:'teacher'}]);
  sfx.click();paintStars(n,`⭐ 별 ${n}개 · 저장하는 중…`);
  clearTimeout(rateT);rateT=setTimeout(()=>sendRate(gid,n,true),350);
}
async function sendRate(gid,n,teacher){
  try{await call('rate',teacher?{room:gid,stars:n}:{group:myGroup(),room:gid,stars:n});paintStars(n,`✅ 별 ${n}개를 줬어요`);refresh()}
  catch(e){paintStars(n,'⚠️ 저장하지 못했어요. 다시 눌러 주세요');toast(e.message,'bad')}
}
function openRoom(gid){UI.room=gid;resetUI();UI.intro=true;const qs=ROOMS[gid].questions;const i=qs.findIndex(q=>qState(q)==='open');UI.q=i<0?0:i;qtStop();render();scrollTo({top:0})}
function backToBoard(){UI.room=null;resetUI();qtStop();LAST_SIG='';render()}
function startRoom(){UI.intro=false;sfx.click();enterQ()}
function goQ(i){UI.q=i;resetUI();enterQ()}
function enterQ(){
  const q=ROOMS[UI.room].questions[UI.q];
  if(isT()){const w=winnersOf(q.id);if(w.length){UI.revealed=true;UI.picked=w;qtStop()}else qtStart()}
  render();scrollTo({top:0,behavior:'smooth'});setTimeout(()=>{const i=$('#ans-input');if(i)i.focus()},60);
}
function pick(v){if(UI.revealed||UI.busy)return;UI.sel=v;sfx.click();render()}
function useHint(){UI.hint=true;if(!isT()){const k='gem.hints.'+CFG.gameId;const a=JSON.parse(lsGet(k)||'[]');a.push(ROOMS[UI.room].questions[UI.q].id);lsSet(k,JSON.stringify(a))}sfx.click();render()}
function hintUsed(qid){try{return JSON.parse(lsGet('gem.hints.'+CFG.gameId)||'[]').includes(qid)}catch(e){return false}}
function answerArea(q,R,rightAns){
  if(q.type==='mc')return `<div class="ans-mc">${q.options.map((o,k)=>String(o).trim()?`<button class="${UI.sel===k?'sel':''} ${R&&String(rightAns)===String(k)?'right':''} ${R&&UI.sel===k&&String(rightAns)!==String(k)?'wrong':''}" onclick="pick(${k})" ${R?'disabled':''}><i>${k+1}</i>${esc(o)}</button>`:'').join('')}</div>`;
  if(q.type==='ox')return `<div class="ans-ox">${['O','X'].map(v=>`<button class="${v.toLowerCase()} ${UI.sel===v?'sel':''} ${R&&rightAns===v?'right':''} ${R&&UI.sel===v&&rightAns!==v?'wrong':''}" onclick="pick('${v}')" ${R?'disabled':''}>${v}</button>`).join('')}</div>`;
  if(R)return '';
  return `<div class="ans-text"><input id="ans-input" class="${q.type==='code'?'code':''}" ${q.type==='code'?'inputmode="numeric" placeholder="● ● ●"':'placeholder="모둠의 답을 입력하세요"'} value="${esc(UI.input)}" oninput="UI.input=this.value" onkeydown="if(event.key==='Enter')checkAnswer()" autocomplete="off"></div>`;
}
function shake(){const s=$('#stage');if(!s)return;s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')}
function readInput(q){if(q.type==='mc'||q.type==='ox'){if(UI.sel===null){toast('먼저 답을 골라 주세요');return null}return String(UI.sel)}
  const v=(($('#ans-input')||{}).value)||'';UI.input=v;if(!v.trim()){toast('답을 입력해 주세요');return null}return v}

function doneCount(solver,gid){const qs=ROOMS[gid].questions;let ok=0,done=0;qs.forEach(q=>{const r=RECS.find(x=>x.t==='solve'&&x.s===solver&&x.q===q.id);if(r&&r.c){ok++;done++}else if(r&&r.a>=(TRIES[q.type]||3))done++});return{ok,done,n:qs.length}}
function roomsInner(){
  if(isT()){
    return CFG.groups.map(g=>{const t=targetOf(g),r=ROOMS[g.id];
      if(!r||!r.questions.length)return `<div class="room-card empty" style="--c:${t.color}"><div class="rc-top"><span class="rc-emoji" style="opacity:.5">${t.emoji}</span><span class="rc-lock">⏳</span></div><div class="rc-name">${t.name} 방</div><div class="rc-title">${g.emoji} ${esc(g.name)}이 만드는 중…</div></div>`;
      const esc_=CFG.groups.filter(x=>x.id!==g.id&&(()=>{const d=doneCount(x.id,g.id);return d.done===d.n})()).length;
      const sc=scoreOf(g.id);
      return `<button class="room-card" style="--c:${t.color}" onclick="openRoom('${g.id}')"><div class="rc-top"><span class="rc-emoji">${t.emoji}</span><span class="rc-lock">📺</span></div>
        <div class="rc-name">${t.name} 방</div><div class="rc-title">${esc(roomTitle(g.id))}</div>
        <div class="rc-dots">${r.questions.map(()=>'<i class="on"></i>').join('')}</div>
        <div class="rc-by">출제 ${g.emoji} ${esc(g.name)} · 자물쇠 ${r.questions.length}개 · 탈출 ${esc_}모둠${sc.stars?` · ★${sc.stars}`:''}</div></button>`}).join('');
  }
  const me=myGroup();
  return roomGroups().map(g=>{const t=targetOf(g),r=ROOMS[g.id];
    if(g.id===me)return `<button class="room-card" style="--c:${t.color}" disabled><div class="rc-top"><span class="rc-emoji">${t.emoji}</span><span class="rc-lock">🏠</span></div><div class="rc-name">우리 모둠 방</div><div class="rc-title">${esc(roomTitle(g.id))}</div><div class="rc-by" style="margin-top:14px">다른 모둠이 풀고 있어요!</div></button>`;
    const states=r.questions.map(q=>qState(q)),done=states.every(s=>s!=='open'),ok=states.filter(s=>s==='ok').length;
    const myStar=(MYRECS.find(x=>x.t==='star'&&x.r===g.id)||{}).p||0;
    return `<button class="room-card" style="--c:${t.color}" onclick="openRoom('${g.id}')"><div class="rc-top"><span class="rc-emoji">${t.emoji}</span><span class="rc-lock">${done?'🔓':'🔒'}</span></div>
      <div class="rc-name">${t.name} 방</div><div class="rc-title">${esc(roomTitle(g.id))}</div>

}
function matrixInner(){
  const rg=roomGroups();if(!rg.length)return '<p class="help">아직 전송된 방이 없어요.</p>';
  return `<table class="matrix"><thead><tr><th>푼 모둠 ＼ 방</th>${rg.map(g=>`<th>${targetOf(g).emoji} ${targetOf(g).name}</th>`).join('')}<th>점수</th></tr></thead><tbody>
  ${CFG.groups.map(s=>`<tr><td>${s.emoji} ${esc(s.name)}</td>${rg.map(g=>{if(g.id===s.id)return '<td><span class="cell own">출제</span></td>';const d=doneCount(s.id,g.id);
    return `<td><span class="cell ${d.done===d.n?'done':d.done?'part':''}">${d.ok}/${d.n}</span></td>`}).join('')}<td><b>${scoreOf(s.id).total}</b></td></tr>`).join('')}</tbody></table>`;
}
function winnersOf(qid){return RECS.filter(r=>r.t==='solve'&&r.q===qid&&r.c).map(r=>r.s)}
function tRoom(){
  const gid=UI.room,g=byId(gid),t=targetOf(g),qs=ROOMS[gid].questions;if(UI.q>=qs.length)UI.q=0;
  const qi=UI.q,q=qs[qi],pts=Math.round((+q.points||CFG.settings.points)*(UI.hint?CFG.settings.hintRate/100:1));

  let stage;
  if(UI.intro)stage=introStage(gid,t,qs.length);
  else stage=`<div class="q-stage" id="stage" style="--c:${t.color}">
    <div class="q-meta"><span class="pill">🔒 자물쇠 ${qi+1} / ${qs.length}</span><span class="pill">${QT[q.type].icon} ${QT[q.type].label}</span>
      <span class="pill pts ${UI.hint?'cut':''}">⭐ ${pts}점${UI.hint?' (힌트)':''}</span>
      ${CFG.settings.qSec&&!UI.revealed?`<span class="q-timer" data-qtimer onclick="qtToggle()" title="눌러서 멈춤/계속"></span>`:''}</div>
    <div class="q-prompt">${esc(q.prompt)}</div>${imgTag(q,'q-img')}
    ${answerArea(q,UI.revealed,q.type==='ox'?oxNorm(q.answer):q.answer)}
    ${UI.hint&&q.hint?`<div class="hint-box">💡 ${esc(q.hint)}</div>`:''}
    ${UI.revealed?revealPanel(g,q,qi,qs.length,pts):`<div class="q-actions">
      <button class="btn ghost big" ${!q.hint||UI.hint?'disabled':''} onclick="useHint()">💡 ${q.hint?(UI.hint?'힌트 공개됨':`힌트 보기 (점수 ${CFG.settings.hintRate}%)`):'힌트 없음'}</button>
      <button class="btn gold big" onclick="tCheck()">🔑 정답 확인</button><button class="btn ghost big" onclick="tReveal(false)">👀 정답 공개</button></div>`}
    ${UI.unlock?'<div class="unlock-pop">🔓</div>':''}</div>`;
  const tStar=(RECS.find(r=>r.t==='star'&&r.s==='teacher'&&r.r===gid)||{}).p||0;
  return `<div class="page"><div class="play-grid"><section>
    <div class="room-top"><button class="btn glass" onclick="backToBoard()">← 지도</button><div><div class="rt-name">${t.emoji} ${t.name} 방 <small style="font-size:14px;opacity:.7">📺 프로젝터 진행</small></div><div class="rt-by">${esc(roomTitle(gid))} · 출제 ${g.emoji} ${esc(g.name)}</div></div></div>
    ${lockTrack(qs,qi,x=>solvedBy(x.id)?'ok':'open',false)}${stage}
  </section>${scoreboard()}</div>
  ${UI.escaped?`<div class="overlay"><div class="escape-card" style="--c:${t.color}"><div class="esc-stamp anim">ESCAPED!</div><h2>${t.emoji} ${t.name} 방 탈출 성공!</h2>
    <p>출제한 <b>${g.emoji} ${esc(g.name)}</b>의 문제는 어땠나요? 선생님 별점도 별점 평균에 들어가요.</p>${tStarsHTML(gid,tStar)}
    <button class="btn gold big" onclick="backToBoard()">🗺️ 지도로 돌아가기</button></div></div>`:''}</div>`;
}
function tStarsHTML(gid,st){return `<div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=st?'on':''}" onclick="tRate('${gid}',${n})">★</button>`).join('')}</div><div class="rate-msg">${st?`✅ 별 ${st}개를 줬어요`:'별을 눌러 주세요'}</div>`}
function revealPanel(g,q,qi,n,pts){
  const alt=q.type==='short'?String(q.answer).split(/[,|]/).slice(1).map(s=>s.trim()).filter(Boolean):[];
  const device=RECS.filter(r=>r.t==='solve'&&r.q===q.id&&r.c&&r.src==='student').map(r=>r.s);
  return `<div style="margin-top:24px"><div class="answer-box"><span>정답</span><b>${esc(tAnswerText(q))}</b>${alt.length?`<small style="color:var(--muted)">(${esc(alt.join(', '))}도 정답)</small>`:''}</div>
    <div class="award"><h4>✋ 맞힌 모둠을 모두 고르세요 <small>모둠당 +${pts}점 · 📱 = 학생 기기에서 이미 맞힘</small></h4>
      <div class="award-groups">${CFG.groups.map(x=>{const own=x.id===g.id,dev=device.includes(x.id);return `<button class="ag ${UI.picked.includes(x.id)||dev?'on':''}" style="--gc:${x.color}" ${own||dev?'disabled':''} onclick="togglePick('${x.id}')">${x.emoji} ${esc(x.name)}${own?'<small>출제</small>':dev?'<small>📱</small>':''}</button>`}).join('')}</div>
      <div class="award-actions"><button class="btn ghost" onclick="pickAll()">모두 정답</button><button class="btn ghost" onclick="UI.picked=[];render()">선택 해제</button>
      <button class="btn gold big" id="award-btn" onclick="confirmScore()">${qi<n-1?'점수 주고 다음 자물쇠 →':'점수 주고 탈출! 🚪'}</button></div></div></div>`;
}
function tAnswerText(q){if(q.type==='mc')return `${CIRC[+q.answer]||''} ${q.options[+q.answer]||''}`;if(q.type==='short')return String(q.answer).split(/[,|]/)[0].trim();return q.type==='ox'?oxNorm(q.answer):q.answer}
function tCheck(){const q=ROOMS[UI.room].questions[UI.q];const v=readInput(q);if(v==null)return;let ok;
  if(q.type==='mc')ok=v===String(q.answer);else if(q.type==='ox')ok=oxNorm(v)===oxNorm(q.answer);else if(q.type==='code')ok=v.replace(/\D/g,'')===String(q.answer).replace(/\D/g,'');
  else ok=String(q.answer).split(/[,|]/).map(norm).filter(Boolean).includes(norm(v));
  if(ok)tReveal(true);else{sfx.wrong();shake();toast('땡! 자물쇠가 꿈쩍도 하지 않아요 🔒','bad')}}
function tReveal(correct){const q=ROOMS[UI.room].questions[UI.q];UI.revealed=true;UI.picked=winnersOf(q.id);qtStop();if(correct){UI.unlock=true;sfx.right()}else sfx.click();render();UI.unlock=false}
function togglePick(id){UI.picked=UI.picked.includes(id)?UI.picked.filter(x=>x!==id):[...UI.picked,id];sfx.click();render()}
function pickAll(){UI.picked=CFG.groups.filter(x=>x.id!==UI.room).map(x=>x.id);render()}
async function confirmScore(){
  const qs=ROOMS[UI.room].questions,q=qs[UI.q];const b=$('#award-btn');if(b){b.disabled=true;b.textContent='저장 중…'}
  try{await call('award',{room:UI.room,qid:q.id,winners:UI.picked,hint:UI.hint});await refresh()}catch(e){toast(e.message,'bad');if(b){b.disabled=false}return}
  if(UI.q>=qs.length-1){UI.escaped=true;LAST_SIG='';render();sfx.fanfare();confetti();return}
  UI.q++;resetUI();enterQ();
}
function qtStart(){const s=CFG.settings.qSec;if(!s){qtStop();return}QTM={remaining:s,running:true,endAt:Date.now()+s*1000,done:false}}
function qtStop(){QTM.running=false;QTM.done=false}
function qtToggle(){if(QTM.done)return qtStart();if(QTM.running){QTM.remaining=Math.max(0,(QTM.endAt-Date.now())/1000);QTM.running=false}else{QTM.running=true;QTM.endAt=Date.now()+QTM.remaining*1000}}

/* ---------- 3. 학생: 기기에서 풀기 ---------- */
function myRec(qid){return MYRECS.find(r=>r.t==='solve'&&r.q===qid)}
function qState(q){const r=myRec(q.id);if(!r)return 'open';if(r.c)return 'ok';if(r.a>=(q.tries||TRIES[q.type]||3))return 'fail';return 'open'}
function sPlay(){
  if(UI.room&&ROOMS[UI.room])return sRoom();
  const g=byId(myGroup());
  return `<div class="page"><div class="play-grid"><section>
    <div class="board-head"><span class="eyebrow">STEP 3 · 다 함께 방탈출</span><h1>🗺️ 탈출 지도</h1>
    <p>${g.emoji} <b>${esc(g.name)}</b>, 다른 모둠의 방을 골라 자물쇠를 풀어 보세요! 맞히면 점수가 바로 점수판에 올라가요.<br>정답 기회: O/X 1번 · 객관식 2번 · 단답형·숫자 자물쇠 3번 · 힌트를 보면 점수 ${CFG.settings.hintRate}%</p></div>
    <div class="rooms" data-live="rooms">${roomsInner()}</div>
  </section>${scoreboard()}</div></div>`;
}
function sRoom(){
  const gid=UI.room,g=byId(gid),t=targetOf(g),qs=ROOMS[gid].questions;if(UI.q>=qs.length)UI.q=0;
  const qi=UI.q,q=qs[qi],rec=myRec(q.id),st=qState(q),tries=q.tries||TRIES[q.type]||3,used=rec?rec.a:0;
  const hint=UI.hint||hintUsed(q.id);UI.hint=hint;
  const pts=Math.round((+q.points||CFG.settings.points)*(hint?CFG.settings.hintRate/100:1));
  const roomDone=qs.every(x=>qState(x)!=='open');
  let stage;
  if(UI.intro)stage=introStage(gid,t,qs.length);
  else{
    const done=st!=='open';
    let body;
    if(done){const ok=st==='ok';
      body=`<div class="result ${ok?'ok':'bad'}"><span class="r-ico">${ok?'🔓':'💥'}</span><div>${ok?`<b>정답! +${rec.p}점</b>자물쇠가 열렸어요`:`<b>기회를 모두 썼어요</b>정답은 <b>${esc(rec.ans||'')}</b>`}</div><span class="sp"></span>
        ${roomDone?`<button class="btn gold big" onclick="UI.escaped=true;render()">🚪 탈출 결과 보기</button>`:`<button class="btn gold big" onclick="nextOpen()">다음 자물쇠 →</button>`}</div>`;
    }else body=`${answerArea(q,false)}${hint&&q.hint?`<div class="hint-box">💡 ${esc(q.hint)}</div>`:''}
      <div class="q-actions"><button class="btn ghost big" ${!q.hint||hint||UI.busy?'disabled':''} onclick="useHint()">💡 ${q.hint?(hint?'힌트 공개됨':`힌트 보기 (점수 ${CFG.settings.hintRate}%)`):'힌트 없음'}</button>
      <button class="btn gold big" onclick="sCheck()" ${UI.busy?'disabled':''}>${UI.busy?'⏳ 확인 중…':'🔑 정답 확인'}</button></div>`;
    stage=`<div class="q-stage" id="stage" style="--c:${t.color}">
      <div class="q-meta"><span class="pill">🔒 자물쇠 ${qi+1} / ${qs.length}</span><span class="pill">${QT[q.type].icon} ${QT[q.type].label}</span>
        <span class="pill pts ${hint?'cut':''}">⭐ ${pts}점${hint?' (힌트)':''}</span>${done?'':`<span class="pill tries">🎯 남은 기회 ${tries-used}번</span>`}</div>
      <div class="q-prompt">${esc(q.prompt)}</div>${imgTag(q,'q-img')}${body}${UI.unlock?'<div class="unlock-pop">🔓</div>':''}</div>`;
  }
  const myStar=(MYRECS.find(x=>x.t==='star'&&x.r===gid)||{}).p||0;
  const okN=qs.filter(x=>qState(x)==='ok').length,gain=qs.reduce((a,x)=>{const r=myRec(x.id);return a+(r&&r.c?r.p:0)},0);
  return `<div class="page"><div class="play-grid"><section>
    <div class="room-top"><button class="btn glass" onclick="backToBoard()">← 지도</button><div><div class="rt-name">${t.emoji} ${t.name} 방</div><div class="rt-by">${esc(roomTitle(gid))} · 출제 ${g.emoji} ${esc(g.name)}</div></div></div>
    ${lockTrack(qs,qi,qState,roomDone)}${stage}
  </section>${scoreboard()}</div>
  ${UI.escaped?`<div class="overlay"><div class="escape-card" style="--c:${t.color}"><div class="esc-stamp ${UI.stampAnim?'anim':''}">ESCAPED!</div>
    <h2>${t.emoji} ${t.name} 방 탈출!</h2><p>자물쇠 ${qs.length}개 중 <b>${okN}개</b> 정답 · <b>+${gain}점</b><br>${g.emoji} ${esc(g.name)}의 문제는 어땠나요? 별점을 주면 출제 모둠이 보너스를 받아요.</p>
    ${starsHTML(gid,myStar)}<button class="btn gold big" onclick="backToBoard()">🗺️ 지도로 돌아가기</button></div></div>`:''}</div>`;
}
function nextOpen(){const qs=ROOMS[UI.room].questions;let i=qs.findIndex((x,k)=>k>UI.q&&qState(x)==='open');if(i<0)i=qs.findIndex(x=>qState(x)==='open');if(i<0){UI.escaped=true;UI.stampAnim=true;render();UI.stampAnim=false;return}UI.q=i;resetUI();enterQ()}
async function sCheck(){
  if(UI.busy)return;const q=ROOMS[UI.room].questions[UI.q];const v=readInput(q);if(v==null)return;
  UI.busy=true;render();
  try{
    const r=await call('answer',{group:myGroup(),room:UI.room,qid:q.id,answer:v,hint:UI.hint});
    MYRECS=MYRECS.filter(x=>!(x.t==='solve'&&x.q===q.id)).concat([r.record]);UI.busy=false;
    if(r.correct){UI.unlock=true;sfx.right();render();UI.unlock=false;toast(`🔓 정답! +${r.record.p}점`,'good');refresh()}
    else if(r.done){sfx.wrong();render();toast('💥 기회를 모두 썼어요. 정답을 확인하세요','bad');refresh()}
    else{sfx.wrong();UI.input='';render();shake();toast(`땡! 남은 기회 ${r.left}번`,'bad')}
  }catch(e){UI.busy=false;render();toast(e.message,'bad')}
}

/* ================= 4. 시상식 ================= */

  return{maker:maxS?SCORES.filter(x=>x.stars===maxS):[],detective:maxC?SCORES.filter(x=>x.correct===maxC):[]}}

    ${isT()?`<div class="banner ${CFG.phase==='awards'?'live':'info'}"><div>${CFG.phase==='awards'?'📢<b>학생 화면에도 시상식이 열려 있어요</b><small>학생 기기에는 최종 순위가 바로 보여요.</small>':'🙈<b>학생 화면에는 아직 시상식이 닫혀 있어요</b><small>발표가 끝나면 학생 화면에도 열어 주세요. 학생 기기의 풀이도 함께 닫혀요.</small>'}</div><span class="sp"></span>
      ${CFG.phase==='awards'?`<button class="btn glass sm" onclick="setAwardsOpen(false)">닫기 (풀이 다시 열기)</button>`:`<button class="btn gold" onclick="setAwardsOpen(true)">📢 학생 화면에도 공개</button>`}<button class="btn glass sm" onclick="saveScoresNow()">📊 시트에 기록</button></div>`:''}
    <div class="podium">${slot(2)}${slot(1)}${slot(3)}</div>
    ${isT()?`<div class="reveal-bar">${r<4?`<button class="btn gold big" onclick="nextReveal()">${labels[r]}</button>`:''}${r>0?`<button class="btn glass" onclick="UI.awards=0;render()">↺ 처음부터 발표</button>`:''}${r<4?`<button class="btn glass" onclick="UI.awards=4;render()">⏭ 한 번에 보기</button>`:''}</div>`:''}
    ${r>=4?`<div class="specials">${spCard('🧠','최고 출제왕상','다른 모둠에게 가장 높은 별점을 받은 방',sp.maker,'maker')}${spCard('🔍','명탐정상','가장 많은 자물쇠를 푼 모둠',sp.detective,'detective')}${spCard('🌏','용감한 탐험가상','끝까지 함께한 모든 모둠',list,'explorer')}</div>
    <section class="card"><h2>📊 최종 점수표</h2><div class="tbl-wrap"><table class="rank"><thead><tr><th>순위</th><th>모둠</th><th>담당</th><th>푼 자물쇠</th><th>정답 점수</th><th>받은 별점</th><th>조정</th><th>합계</th><th></th></tr></thead><tbody>
      ${list.map(x=>{const g=byId(x.id);if(!g)return '';const t=targetOf(g);return `<tr><td class="total">${x.rank}</td><td><b>${g.emoji} ${esc(g.name)}</b></td><td>${t.emoji} ${t.name}</td><td>${x.correct}개</td><td>${x.ans}</td><td>${x.stars?`★${x.stars} (+${x.star})`:'-'}</td><td>${x.adj?(x.adj>0?'+':'')+x.adj:'-'}</td><td class="total">${x.total}</td><td><button class="btn ghost sm" onclick="openCert('${x.id}')">📜 상장</button></td></tr>`}).join('')}

}
function nextReveal(){let r=UI.awards+1;while(r<=3&&!SCORES[3-r])r++;UI.awards=r;UI.podPop=4-r;render();UI.podPop=0;if(r===3){sfx.fanfare();confetti(260)}else{sfx.right();if(r>3)confetti(120)}}
async function setAwardsOpen(open){CFG.phase=open?'awards':'play';await saveCfgNow();render();toast(open?'📢 학생 화면에 시상식을 열었어요':'학생 화면의 시상식을 닫았어요','good')}
const AWARDS={
  1:{icon:'🥇',name:'최우수 탐험대상',why:'가장 높은 점수를 얻어 최고의 지리 탐구 능력을 보여 주었기에'},
  2:{icon:'🥈',name:'우수 탐험대상',why:'뛰어난 협동심과 지리 탐구 능력을 보여 주었기에'},
  3:{icon:'🥉',name:'장려 탐험대상',why:'꾸준한 협력으로 훌륭한 지리 탐구 능력을 보여 주었기에'},
  maker:{icon:'🧠',name:'최고 출제왕상',why:'친구들에게 가장 높은 별점을 받은 멋진 문제를 만들었기에'},
  detective:{icon:'🔍',name:'명탐정상',why:'가장 많은 자물쇠를 풀어 명탐정다운 추리력을 보여 주었기에'},
  explorer:{icon:'🌏',name:'용감한 탐험가상',why:'끝까지 서로 돕고 용감하게 탐험하였기에'}};
function earned(gid){const x=scoreOf(gid),sp=specials(),a=[];if(x.rank<=3)a.push(String(x.rank));if(sp.maker.some(y=>y.id===gid))a.push('maker');if(sp.detective.some(y=>y.id===gid))a.push('detective');a.push('explorer');return a}
function openCert(gid,key){
  const g=byId(gid),t=targetOf(g),keys=earned(gid);key=key&&AWARDS[key]?key:keys[0];const A=AWARDS[key];
  const d=new Date(),date=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`,no=CFG.groups.indexOf(g)+1;
  openModal(`<div id="cert" class="cert"><div class="cert-inner">
    <span class="cert-corner tl">🌏</span><span class="cert-corner tr">🧭</span><span class="cert-corner bl">🗝️</span><span class="cert-corner br">🗺️</span>
    <div class="cert-no">제 ${d.getFullYear()}-${String(no).padStart(2,'0')} 호</div><h1>상 장</h1>
    <div class="cert-award">${A.icon} ${A.name}</div><div class="cert-to">${esc(CFG.klass)}<b>${g.emoji} ${esc(g.name)}</b></div>
    <p class="cert-body">위 모둠은 「${esc(CFG.title||'지리 방탈출')}」에서 <b>${t.name}</b> 탈출 방을 직접 설계하고, 친구들이 만든 방을 슬기롭게 풀어내며 ${A.why} 이 상장을 수여합니다.</p>
    <div class="cert-date">${date}</div><div class="cert-sign">${CFG.klass?esc(CFG.klass)+josa(CFG.klass,'을','를')+' 아끼는 ':''}${esc(CFG.teacher||'지리')} 선생님<span class="seal">지리<br>방탈출</span></div></div></div>
    <div class="cert-actions"><div class="tabs">${keys.map(k=>`<button class="btn ${k===key?'gold':'ghost'} sm" onclick="openCert('${gid}','${k}')">${AWARDS[k].icon} ${AWARDS[k].name}</button>`).join('')}</div>
    ${isT()?`<button class="btn ink" onclick="window.print()">🖨️ 인쇄하기</button>`:''}</div>`,'wide');
}

/* ================= 시작 ================= */
render();
if(hasServer()&&ROLE){refresh();startPolling()}
</script>
</body>
</html>
