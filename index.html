<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지리 방탈출 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0b1730; --paper:#fffaf1; --paper2:#f5eedf; --ink:#1b2340; --muted:#6c7391;
  --line:#e9dfca; --gold:#ffc145; --gold2:#ff9f1c; --coral:#ff6b6b; --mint:#22c3a0; --sky:#4dabf7;
  --r:22px; --shadow:0 18px 40px -18px rgba(0,0,0,.55);
  --display:'Jua','Noto Sans KR',system-ui,sans-serif; --body:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--body);color:var(--ink);background:
  radial-gradient(1200px 600px at 10% -10%, #24508f 0, transparent 60%),
  radial-gradient(900px 500px at 100% 110%, #3b2a7a 0, transparent 55%),
  var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;z-index:0;
  background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 64px),repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 64px);
  -webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;letter-spacing:-.01em}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:12px 22px;
  background:rgba(11,23,48,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);color:#fff}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 6px 16px -6px var(--gold2);flex:none}
.brand b{font-family:var(--display);font-size:20px;font-weight:400;display:block;line-height:1.1}
.brand small{opacity:.6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:240px}
.stepper{display:flex;gap:6px;margin:0 auto;background:rgba(255,255,255,.06);padding:5px;border-radius:999px}
.step{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:rgba(255,255,255,.62);padding:8px 15px;border-radius:999px;font-weight:700;font-size:14px;transition:.2s}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:rgba(255,255,255,.12)}
.step:hover{color:#fff}
.step.on{background:var(--gold);color:#3a2600}
.step.on i{background:rgba(0,0,0,.15)}
.step.locked{opacity:.45}
.tools{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:18px}
.icon-btn:hover{background:rgba(255,255,255,.14)}
.role-chip{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);font-weight:700;font-size:13.5px;white-space:nowrap}
.role-chip .dot{width:9px;height:9px;border-radius:50%;background:#8a93ad}
.role-chip .dot.ok{background:#3ddc97;box-shadow:0 0 0 3px rgba(61,220,151,.2)}
.role-chip .dot.bad{background:var(--coral);box-shadow:0 0 0 3px rgba(255,107,107,.25)}
.hdr-timer{font-family:var(--display);font-size:20px;padding:7px 14px;border-radius:12px;background:rgba(255,193,69,.15);color:var(--gold);border:1px solid rgba(255,193,69,.35);cursor:pointer;font-variant-numeric:tabular-nums}
.hdr-timer.urgent{color:#fff;background:var(--coral);border-color:var(--coral);animation:pulse 1s infinite}

/* ---------- layout ---------- */
#app{position:relative;z-index:1}
.page{max-width:1280px;margin:0 auto;padding:28px 24px 80px}
.card{background:var(--paper);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.eyebrow{display:inline-block;font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--gold2);text-transform:uppercase}
.card h2{font-size:24px;margin:2px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
label.lb{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.inp{width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 14px;outline:none;transition:.15s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,193,69,.22)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.55}
.help{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:700;font-size:15px;transition:transform .12s, box-shadow .2s, background .2s;white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.gold{background:linear-gradient(180deg,#ffd166,var(--gold2));color:#3a2600;box-shadow:0 8px 18px -8px var(--gold2),0 -3px 0 rgba(0,0,0,.12) inset}
.btn.ink{background:var(--ink);color:#fff}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 8px 18px -8px var(--mint)}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 8px 18px -8px var(--coral)}
.btn.ghost{background:rgba(27,35,64,.06);color:var(--ink)}
.btn.ghost:hover{background:rgba(27,35,64,.11)}
.btn.glass{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18)}
.btn.glass:hover{background:rgba(255,255,255,.18)}
.btn.big{padding:15px 26px;font-size:17px;border-radius:16px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:20px;padding:16px 20px;margin-bottom:18px;font-weight:700}
.banner b{font-family:var(--display);font-weight:400;font-size:21px;display:block}
.banner small{font-weight:500;opacity:.8}
.banner.info{background:rgba(77,171,247,.14);border:1px solid rgba(77,171,247,.35);color:#dceeff}
.banner.live{background:rgba(34,195,160,.14);border:1px solid rgba(34,195,160,.4);color:#d5fff3}
.banner.warm{background:linear-gradient(90deg,var(--gold),#ff8fab);color:#3a2600}
.live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#3ddc97;margin-right:6px;animation:pulse 1.4s infinite}

/* ---------- role / connect / wait ---------- */
.center-wrap{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:30px 20px}
.role-box{max-width:920px;width:100%;text-align:center;color:#fff}
.role-box h1{font-size:clamp(40px,6vw,66px);margin:12px 0 10px}
.role-box h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold),#ff8fab);-webkit-background-clip:text;background-clip:text;color:transparent}
.role-box>p{color:rgba(255,255,255,.75);font-size:17px;margin:0 0 30px;line-height:1.6}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.role-card{border:0;border-radius:30px;padding:34px 26px;background:var(--paper);color:var(--ink);text-align:center;box-shadow:var(--shadow);transition:transform .18s, box-shadow .18s;position:relative;overflow:hidden}
.role-card:hover{transform:translateY(-6px);box-shadow:0 30px 60px -24px #000}
.role-card .ico{font-size:82px;line-height:1;display:block;margin-bottom:10px}
.role-card b{font-family:var(--display);font-weight:400;font-size:34px;display:block}
.role-card small{display:block;color:var(--muted);margin-top:8px;line-height:1.6;font-size:15px}
.role-card.t{background:linear-gradient(160deg,#fff7e0,var(--paper))}
.role-card.s{background:linear-gradient(160deg,#e6f7ff,var(--paper))}
.role-card .tag{position:absolute;top:16px;right:16px;font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:var(--ink);color:#fff}
.wait-card{max-width:620px;width:100%;text-align:center;background:var(--paper);border-radius:30px;padding:44px 34px;box-shadow:var(--shadow)}
.wait-card .w-ico{font-size:80px;line-height:1;animation:float 3s ease-in-out infinite;display:block}
.steps-how{text-align:left;background:var(--paper2);border-radius:16px;padding:14px 18px 14px 34px;margin:0 0 16px;line-height:1.8;font-size:14.5px}
.steps-how b{color:var(--ink)}
.url-ex{display:block;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:6px 10px;margin:4px 0;word-break:break-all}
.url-ex.bad{color:#b42318;text-decoration:line-through}
.url-ex.good{color:#0f7a63}
.pw-row{display:flex;gap:8px}
.pw-row .inp{flex:1}
.caps{color:#c2410c;font-weight:700;font-size:13px;margin-top:6px}
.shake{animation:shake .45s}
.helper{text-align:left}
.helper .w-ico,.helper h2,.helper>p{text-align:center}
.pin-badge{flex:none;font-weight:900;font-size:13px;color:var(--muted);background:var(--paper2);padding:6px 9px;border-radius:10px;font-variant-numeric:tabular-nums}
.class-bar{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:14px 16px;margin-bottom:8px;color:#fff}
.cb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cb-head small{color:rgba(255,255,255,.7);font-size:13px}
.cls-list{display:flex;flex-wrap:wrap;gap:8px}
.cls{display:flex;align-items:stretch;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.1);border:2px solid transparent;color:#fff}
.cls.on{background:var(--paper);border-color:var(--gold);color:var(--ink)}
.cls-main{border:0;background:transparent;text-align:left;padding:8px 12px;color:inherit;min-width:110px}
.cls-main:hover:not(:disabled){background:rgba(255,255,255,.12)}
.cls-main:disabled{cursor:default;opacity:1}
.cls-main b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
.cls-main small{font-size:11.5px;opacity:.75}
.cls-del{border:0;background:rgba(0,0,0,.12);padding:0 10px;font-size:14px;color:inherit}
.cls-del:hover:not(:disabled){background:var(--coral);color:#fff}
.cls-del:disabled{opacity:.3;cursor:not-allowed}
.cls-empty{margin:0;color:rgba(255,255,255,.75);font-size:14px}
.pin-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.pin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pin-slip{border:2px dashed #c9bb98;border-radius:14px;padding:14px;text-align:center;background:#fff}
.ps-g{font-family:var(--display);font-size:24px}
.ps-t{color:var(--muted);font-size:13px}
.ps-pin{font-family:var(--display);font-size:44px;letter-spacing:.2em;color:#3a2600;margin:4px 0}
.ps-help{font-size:11.5px;color:var(--muted)}
.fresh{display:block;margin-top:4px;color:#0f7a63;font-weight:900;font-size:13px}
.ord-list{display:grid;gap:6px;max-height:55vh;overflow:auto}
.ord-row{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 8px}
.ord-no{font-family:var(--display);width:28px;height:28px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none}
.ord-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.ord-row .mini:disabled{opacity:.3}
.stu-note{background:#e7f5ff;color:#1864ab;border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:16px;text-align:center}
.helper-steps{list-style:none;counter-reset:hs;margin:0;padding:0;display:grid;gap:10px}
.helper-steps li{counter-increment:hs;position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px 14px 58px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.helper-steps li::before{content:counter(hs);position:absolute;left:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#3a2600;font-family:var(--display);font-size:18px;display:grid;place-items:center}
.helper-steps li>b{font-size:16px}
.helper-steps li>span{color:var(--muted);font-size:14px;line-height:1.6}
.helper-steps small{color:var(--muted);font-size:12.5px}
.helper-more{margin-top:14px;font-size:14px;color:var(--muted)}
.helper-more summary{cursor:pointer;font-weight:700}
.helper-more p{margin:8px 0}
.code-in{font-family:var(--display);font-size:44px;text-align:center;letter-spacing:.35em;padding:12px 0 12px .35em;max-width:320px;margin:0 auto;display:block}
.code-in::placeholder{color:#dccfb2}
.join-card{display:flex;align-items:center;gap:22px;flex-wrap:wrap;color:#fff;margin-bottom:22px;padding:18px 22px;border-radius:26px;
  background:linear-gradient(120deg,rgba(255,193,69,.18),rgba(255,143,171,.12));border:1px solid rgba(255,193,69,.4)}
.qr{background:#fff;padding:8px;border-radius:16px;width:146px;height:146px;flex:none;display:grid;place-items:center}
.qr img,.qr canvas,.qr-big img,.qr-big canvas{display:block}
.qr-none{color:var(--muted);font-size:12px;text-align:center;line-height:1.4}
.jc-text{flex:1;min-width:240px}
.jc-code{font-family:var(--display);font-size:58px;line-height:1.1;color:var(--gold);letter-spacing:.06em;margin:2px 0 4px}
.jc-text p{margin:0 0 12px;color:rgba(255,255,255,.85);font-size:14.5px}
.code-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:rgba(255,193,69,.15);border:1px solid rgba(255,193,69,.4);color:var(--gold);font-weight:900;cursor:pointer}
.bigtimer.join-mode [data-timer],.bigtimer.join-mode .timer-bar{display:none}
.join-big{display:flex;align-items:center;gap:56px;flex-wrap:wrap;justify-content:center;text-align:left}
.qr-big{background:#fff;padding:16px;border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.jb-label{font-size:22px;font-weight:700;opacity:.8}
.jb-code{font-family:var(--display);font-size:clamp(90px,14vw,190px);line-height:1;color:var(--gold);letter-spacing:.08em;text-shadow:0 0 60px rgba(255,193,69,.4)}
.jb-steps{font-size:22px;line-height:1.9;margin:10px 0 0;padding-left:28px}
.wait-card h2{font-size:32px;margin:14px 0 8px}
.wait-card p{color:var(--muted);line-height:1.7;margin:0 0 18px}
.spinner{width:34px;height:34px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}

/* ---------- setup ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;color:#fff;padding:14px 4px 30px}
.hero h1{font-size:clamp(36px,5vw,58px);line-height:1.08;margin:10px 0 16px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold),#ff8fab);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:16.5px;line-height:1.7;color:rgba(255,255,255,.78);max-width:640px;margin:0}
.flow{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.flow span{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:14px;font-weight:700}
.flow span b{color:var(--gold);font-family:var(--display);font-weight:400;font-size:16px}
.hero-art{position:relative;height:270px;display:grid;place-items:center}
.globe{width:210px;height:210px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#7fd1ff 0,#2f7fd8 45%,#16407e 100%);box-shadow:0 30px 80px -20px rgba(77,171,247,.6), inset -20px -25px 50px rgba(0,0,0,.35);display:grid;place-items:center;font-size:110px}
.orbit{position:absolute;width:300px;height:300px;border:2px dashed rgba(255,255,255,.18);border-radius:50%;animation:spin 30s linear infinite}
.orbit span{position:absolute;font-size:32px;animation:spin 30s linear infinite reverse}
.orbit span:nth-child(1){top:-20px;left:50%;margin-left:-20px}
.orbit span:nth-child(2){bottom:20px;left:-10px}
.orbit span:nth-child(3){bottom:20px;right:-10px}
@keyframes spin{to{transform:rotate(360deg)}}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.span2{grid-column:span 2}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:2px solid var(--line);background:#fff;border-radius:18px;padding:18px;text-align:left;transition:.15s}
.mode.on{border-color:var(--gold);background:#fff6df;box-shadow:0 0 0 4px rgba(255,193,69,.2)}
.mode .m-ico{font-size:34px}
.mode b{display:block;font-family:var(--display);font-weight:400;font-size:21px;margin:6px 0 4px}
.mode small{color:var(--muted);line-height:1.5;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--paper2);font-weight:700}
.counter{display:inline-flex;align-items:center;gap:4px;background:var(--paper2);border-radius:12px;padding:4px;font-family:var(--body)}
.counter button{width:32px;height:32px;border:0;border-radius:9px;background:#fff;font-weight:900;font-size:16px}
.counter b{min-width:64px;text-align:center;font-size:15px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.g-row{display:grid;grid-template-columns:54px minmax(0,1fr) auto;grid-template-rows:auto auto;gap:8px 10px;align-items:center;padding:12px 12px 12px 10px;border-radius:18px;background:#fff;border:2px solid var(--line);border-left:8px solid var(--gc);min-width:0}
.g-emoji{grid-row:1 / span 2;width:54px;height:54px;border-radius:16px;border:0;background:color-mix(in srgb,var(--gc) 18%,#fff);font-size:30px;align-self:center}
.g-emoji:hover{transform:rotate(-8deg)}
.g-row .inp{padding:8px 11px;border-radius:11px;width:100%;min-width:0}
.g-row .g-name{grid-column:2;font-weight:700;font-size:16px}
.g-row .pin-badge{grid-column:3;grid-row:1}
.g-row .g-target{grid-column:2 / span 2;grid-row:2;font-size:14px;background:var(--paper)}
.settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.set{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.set label{font-size:13px;font-weight:700;color:var(--muted);display:block}
.set .row{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.set input{width:80px;border:0;border-bottom:2px solid var(--line);font-family:var(--display);font-size:28px;padding:0 2px;outline:none;background:transparent}
.set span{color:var(--muted);font-weight:700}
.set small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.cta-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.cta-bar .note{color:rgba(255,255,255,.75);font-size:14px;line-height:1.6}
.pick-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pick-card{border:3px solid transparent;border-radius:24px;padding:20px;text-align:left;color:#fff;position:relative;
  background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 45%,#101b38));box-shadow:0 18px 36px -20px var(--c);transition:.15s}
.pick-card:hover{transform:translateY(-3px)}
.pick-card.on{border-color:#fff;box-shadow:0 0 0 5px var(--gold),0 18px 36px -20px var(--c)}
.pick-card .pe{font-size:40px;line-height:1}
.pick-card b{display:block;font-family:var(--display);font-weight:400;font-size:26px;margin-top:8px}
.pick-card small{display:block;opacity:.9;font-weight:700}
.pick-card .ck{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:900}

/* ---------- make ---------- */
.timer-panel{display:grid;grid-template-columns:1fr auto auto;gap:24px;align-items:center;color:#fff;
  background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:22px 26px;margin-bottom:22px}
.timer-panel h2{font-size:28px;margin:4px 0}
.timer-panel p{margin:0;color:rgba(255,255,255,.72);font-size:14px;line-height:1.6}
.timer-box{text-align:center}
.timer-digits{font-family:var(--display);font-size:64px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(255,193,69,.35)}
.timer-digits.urgent{color:var(--coral);animation:pulse 1s infinite}
.timer-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px;width:230px}
.timer-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));border-radius:99px;transition:width .3s linear}
.timer-bar.urgent i{background:var(--coral)}
.timer-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:250px}
.timer-ctrl .btn.wide,.timer-ctrl .t-step{grid-column:span 2}
.t-step{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:4px;color:#fff}
.t-step .btn{flex:1 1 0;min-width:40px;font-size:18px;padding:5px 10px}
.t-step input{flex:0 0 72px;min-width:0;width:72px;text-align:center;border:0;border-radius:9px;padding:6px 4px;font-family:var(--display);font-size:20px;background:rgba(255,255,255,.92);color:var(--ink);outline:none}
.t-step input:focus{box-shadow:0 0 0 3px var(--gold)}
.t-step span{font-weight:700;font-size:14px;opacity:.85}
.t-step.big{padding:6px 8px;border-radius:16px}
.t-step.big .btn{min-width:56px;font-size:24px;padding:10px 14px}
.t-step.big input{width:90px;font-size:30px;flex:0 0 90px}
.t-step.big .btn{flex:none}
.t-step.light .btn{flex:none}
.t-step.light{background:var(--paper2);border-color:var(--line);color:var(--ink)}
.t-step.light input{width:64px;flex:none;background:#fff}
@keyframes pulse{50%{opacity:.55}}
.make-grid{display:grid;grid-template-columns:290px 1fr;gap:22px;align-items:start}
.side{position:sticky;top:90px;display:flex;flex-direction:column;gap:14px}
.g-tabs{display:flex;flex-direction:column;gap:8px}
.g-tab{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:10px 12px;border-radius:18px;border:2px solid transparent;background:rgba(255,255,255,.07);color:#fff;transition:.15s}
.g-tab:hover{background:rgba(255,255,255,.13)}
.g-tab.on{background:var(--paper);color:var(--ink);border-color:var(--gc)}
.gt-emoji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--gc) 28%,transparent);flex:none}
.gt-text{flex:1;min-width:0}
.gt-text b{display:block;font-size:15px}
.gt-text small{opacity:.72;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-count{font-family:var(--display);font-size:15px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.g-tab.on .gt-count{background:var(--paper2)}
.gt-count.ok{background:var(--mint)!important;color:#fff}
.side-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px;color:#fff}
.side-box h4{font-size:16px;margin-bottom:8px}
.side-box ul{margin:0;padding-left:18px;font-size:13px;line-height:1.65;color:rgba(255,255,255,.8)}
.side-box p{font-size:13px;line-height:1.6;color:rgba(255,255,255,.75);margin:0 0 10px}
.side-box .btn{width:100%}
.ed-head{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:var(--r) var(--r) 0 0;color:#fff;flex-wrap:wrap;
  background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 55%,#1b2340))}
.ed-badge{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:38px;flex:none}
.ed-head h2{font-size:30px;margin:0}
.ed-head .eyebrow{color:rgba(255,255,255,.88)}
.send-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border-bottom:1px dashed var(--line);padding:14px 22px}
.send-bar .st{flex:1;min-width:200px;font-size:14px;font-weight:700}
.send-bar .st small{display:block;font-weight:500;color:var(--muted)}
.st-ok{color:#0f7a63}.st-warn{color:#c2410c}
.room-meta{border-radius:0 0 var(--r) var(--r);margin-bottom:18px}
.room-meta .two{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
.q-card{background:var(--paper);border-radius:var(--r);padding:18px 20px 20px;margin-bottom:14px;box-shadow:var(--shadow);border-top:6px solid var(--c);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.q-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lock-no{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:6px}
.lock-no i{font-style:normal;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,#fff)}
.seg{display:flex;background:var(--paper2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.mini{width:32px;height:32px;border-radius:10px;border:0;background:var(--paper2);font-size:14px}
.mini:hover{background:#ece2cc}
.warn{font-size:12px;font-weight:700;color:#c2410c;background:#fff1e6;padding:4px 9px;border-radius:999px}
.ok-tag{font-size:12px;font-weight:700;color:#0f7a63;background:#ddf7f0;padding:4px 9px;border-radius:999px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 6px 4px 4px}
.opt.on{border-color:var(--mint);background:#effcf8}
.opt .mark{width:36px;height:36px;border-radius:10px;border:0;background:var(--paper2);font-size:18px;flex:none}
.opt.on .mark{background:var(--mint);color:#fff}
.opt input{border:0;outline:none;flex:1;min-width:0;padding:8px 4px;background:transparent}
.ox-pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ox-pick button{width:84px;height:64px;border-radius:16px;border:2px solid var(--line);background:#fff;font-family:var(--display);font-size:34px}
.ox-pick button.on{border-color:var(--mint);background:var(--mint);color:#fff}
.ox-pick .need{font-weight:700;color:#c2410c;animation:pulse 1.2s infinite}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.img-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.img-row .inp{flex:1;min-width:180px}
.thumb{height:46px;width:66px;object-fit:cover;border-radius:10px;border:2px solid var(--line);background:var(--paper2)}
.add-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px;border-radius:var(--r);border:2px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.04)}
.add-row .lbl{grid-column:1/-1;color:#fff;font-family:var(--display);font-size:18px;display:flex;justify-content:space-between}
.add-row .lbl small{font-family:var(--body);font-size:13px;opacity:.7}
.add-row button{border:0;border-radius:14px;padding:14px 8px;background:var(--paper);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.add-row button span{font-size:24px}
.add-row button:hover{transform:translateY(-2px)}
.empty-q{text-align:center;color:rgba(255,255,255,.75);padding:26px;font-size:15px}

/* ---------- play ---------- */
.play-grid{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
.board-head{color:#fff;margin-bottom:18px}
.board-head h1{font-size:44px;margin:6px 0}
.board-head p{color:rgba(255,255,255,.75);margin:0;line-height:1.6}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.room-card{position:relative;overflow:hidden;text-align:left;border:0;border-radius:24px;padding:20px;color:#fff;min-height:210px;
  background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 45%,#101b38));box-shadow:0 20px 40px -20px var(--c);transition:transform .18s}
.room-card:hover:not(:disabled){transform:translateY(-4px) rotate(-.4deg)}
.room-card::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
.room-card:disabled{cursor:default;filter:grayscale(.55) brightness(.8)}
.room-card.empty{background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.22);box-shadow:none}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start}
.rc-emoji{font-size:52px;line-height:1}
.rc-lock{font-size:24px;width:46px;height:46px;border-radius:16px;background:rgba(0,0,0,.18);display:grid;place-items:center;position:relative;z-index:1}
.rc-name{font-family:var(--display);font-size:26px;margin-top:12px}
.rc-title{opacity:.88;font-size:14px;min-height:20px}
.rc-dots{display:flex;gap:5px;margin:14px 0 10px}
.rc-dots i{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.25)}
.rc-dots i.on{background:#fff}
.rc-dots i.bad{background:rgba(255,107,107,.85)}
.rc-by{font-size:12.5px;opacity:.9;font-weight:700}
.stamp{position:absolute;right:16px;top:74px;transform:rotate(-14deg);border:4px solid #fff;color:#fff;border-radius:14px;padding:6px 12px;font-family:var(--display);font-size:24px;letter-spacing:.06em;text-align:center;background:rgba(0,0,0,.14);line-height:1}
.stamp small{display:block;font-size:13px;color:var(--gold);letter-spacing:0;margin-top:2px}
.scoreboard{position:sticky;top:90px;background:var(--paper);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.scoreboard h3{font-size:22px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.scoreboard h3 small{font-family:var(--body);font-size:11px;color:var(--mint);font-weight:900;margin-left:auto}
.sb-row{display:grid;grid-template-columns:24px 30px 1fr auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:8px 6px;border-bottom:1px dashed var(--line);border-radius:10px}
.sb-row.me{background:#fff3cf}
.sb-rank{font-family:var(--display);font-size:18px;color:var(--muted);grid-row:span 2}
.sb-emoji{font-size:22px;grid-row:span 2}
.sb-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-pts{font-family:var(--display);font-size:22px;font-weight:400;text-align:right;grid-row:span 2;display:flex;align-items:center;gap:6px}
.sb-bar{height:8px;border-radius:9px;background:var(--paper2);overflow:hidden}
.sb-bar i{display:block;height:100%;background:var(--gc);border-radius:9px;transition:width .5s}
.sb-adj{display:flex;flex-direction:column;gap:2px}
.sb-adj button{width:22px;height:18px;border:0;border-radius:6px;background:var(--paper2);font-size:12px;line-height:1;padding:0;color:var(--muted)}
.sb-note{font-size:11.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.matrix{width:100%;border-collapse:collapse;font-size:14px}
.matrix th,.matrix td{padding:8px;text-align:center;border-bottom:1px dashed var(--line)}
.matrix th{font-size:12.5px;color:var(--muted)}
.matrix td:first-child,.matrix th:first-child{text-align:left;font-weight:700}
.cell{display:inline-block;min-width:44px;padding:3px 8px;border-radius:999px;background:var(--paper2);font-weight:700;font-size:12.5px}
.cell.done{background:var(--mint);color:#fff}
.cell.part{background:#fff3cf;color:#8a5a00}
.cell.own{background:transparent;color:#c9bfa8}
.room-top{display:flex;align-items:center;gap:14px;color:#fff;margin-bottom:16px;flex-wrap:wrap}
.room-top .rt-name{font-family:var(--display);font-size:28px}
.room-top .rt-by{font-size:14px;opacity:.78}
.lock-track{display:flex;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:12px 16px;margin-bottom:16px;overflow-x:auto}
.lk{flex:none;width:54px;height:54px;border-radius:16px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1;transition:.2s}
.lk small{font-size:11px;opacity:.75;margin-top:3px;font-weight:700}
.lk.open{background:var(--mint);border-color:var(--mint)}
.lk.fail{background:rgba(255,107,107,.5);border-color:var(--coral)}
.lk.cur{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,193,69,.3);transform:scale(1.08)}
.lk-line{flex:1;min-width:14px;height:3px;background:rgba(255,255,255,.18);border-radius:3px}
.lk-door{flex:none;font-size:30px;margin-left:10px}
.q-stage{position:relative;background:var(--paper);border-radius:28px;padding:30px 34px 32px;box-shadow:var(--shadow);border-top:8px solid var(--c)}
.q-stage.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.pill{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--paper2)}
.pill.pts{background:#fff3cf;color:#8a5a00}
.pill.cut{background:#ffe7e7;color:#b42318}
.pill.tries{background:#e7f5ff;color:#1864ab}
.q-timer{margin-left:auto;font-family:var(--display);font-size:24px;padding:4px 14px;border-radius:14px;background:var(--ink);color:#fff;font-variant-numeric:tabular-nums;cursor:pointer}
.q-timer.urgent{background:var(--coral);animation:pulse .8s infinite}
.q-prompt{font-size:clamp(21px,2.3vw,31px);font-weight:700;line-height:1.5;white-space:pre-wrap;word-break:keep-all}
.q-img{display:block;max-width:100%;max-height:360px;border-radius:18px;margin:18px 0 4px;box-shadow:0 10px 30px -14px rgba(0,0,0,.4);background:var(--paper2);min-height:60px;min-width:120px}
.ans-mc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.ans-mc button{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--line);background:#fff;border-radius:18px;padding:14px 16px;font-size:clamp(16px,1.6vw,21px);font-weight:700;transition:.15s}
.ans-mc button i{font-style:normal;width:38px;height:38px;flex:none;border-radius:12px;background:var(--paper2);display:grid;place-items:center;font-family:var(--display);font-size:20px}
.ans-mc button.sel{border-color:var(--gold);background:#fff7e0}
.ans-mc button.sel i{background:var(--gold)}
.ans-mc button.right{border-color:var(--mint);background:#e8fbf5}
.ans-mc button.right i{background:var(--mint);color:#fff}
.ans-mc button.wrong{border-color:var(--coral);background:#fff0f0}
.ans-mc button:disabled{cursor:default;opacity:1}
.ans-ox{display:flex;gap:16px;justify-content:center;margin-top:24px}
.ans-ox button{width:150px;height:130px;border-radius:28px;border:4px solid var(--line);background:#fff;font-family:var(--display);font-size:80px;line-height:1;transition:.15s}
.ans-ox button.o{color:#1c7ed6}.ans-ox button.x{color:#e03131}
.ans-ox button.sel{border-color:var(--gold);background:#fff3cf;transform:scale(1.06);box-shadow:0 10px 24px -10px var(--gold2)}
.ans-ox button.right{border-color:var(--mint);background:#e8fbf5}
.ans-ox button.wrong{border-color:var(--coral);background:#fff0f0}
.ans-ox button:disabled{cursor:default}
.ans-text{margin-top:24px;display:flex;gap:10px}
.ans-text input{flex:1;font-size:24px;padding:16px 20px;border:3px solid var(--line);border-radius:18px;outline:none;font-weight:700;min-width:0}
.ans-text input:focus{border-color:var(--gold)}
.ans-text input.code{font-family:var(--display);letter-spacing:.4em;text-align:center;font-size:34px}
.hint-box{margin-top:18px;padding:14px 18px;border-radius:16px;background:#fff8dc;border:2px dashed #f2c94c;font-size:18px;font-weight:700}
.q-actions{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.result{margin-top:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;border-radius:20px;animation:pop .3s}
.result.ok{background:#e8fbf5;border:3px solid var(--mint)}
.result.bad{background:#fff0f0;border:3px solid var(--coral)}
.result .r-ico{font-size:44px;line-height:1}
.result b{font-family:var(--display);font-weight:400;font-size:26px;display:block}
.result .sp{flex:1}
.answer-box{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:18px;background:linear-gradient(90deg,#e8fbf5,#fff);border:3px solid var(--mint);flex-wrap:wrap}
.answer-box span{font-weight:900;color:#0f7a63;font-size:14px;padding:4px 10px;border-radius:999px;background:#c9f2e6;flex:none}
.answer-box b{font-size:26px;font-family:var(--display);font-weight:400}
.award{margin-top:16px;background:var(--paper2);border-radius:18px;padding:16px 18px}
.award h4{font-size:19px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.award h4 small{font-family:var(--body);font-size:13px;color:var(--muted)}
.award-groups{display:flex;flex-wrap:wrap;gap:8px}
.ag{border:3px solid transparent;background:#fff;border-radius:14px;padding:10px 14px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;transition:.12s}
.ag.on{background:var(--gc);color:#fff;border-color:var(--gc)}
.ag:disabled{opacity:.5;cursor:not-allowed}
.ag small{font-size:11px;background:var(--paper2);color:var(--muted);padding:2px 6px;border-radius:6px}
.award-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.intro{text-align:center;padding:50px 30px}
.intro-emoji{font-size:96px;line-height:1;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.intro h2{font-size:40px;margin:8px 0 14px}
.intro .story{font-size:19px;line-height:1.75;max-width:720px;margin:0 auto 26px;white-space:pre-wrap;color:#3b4366}
.unlock-pop{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:140px;animation:unlock 1s ease forwards}
@keyframes unlock{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.15);opacity:1}70%{opacity:1}100%{transform:scale(1.4) translateY(-40px);opacity:0}}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(6,12,28,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.escape-card{background:var(--paper);border-radius:30px;padding:40px 36px 32px;text-align:center;max-width:560px;width:100%;border-top:10px solid var(--c)}
.esc-stamp{display:inline-block;transform:rotate(-8deg);border:6px solid var(--coral);color:var(--coral);font-family:var(--display);font-size:54px;padding:6px 22px;border-radius:18px;letter-spacing:.06em}
.esc-stamp.anim{animation:stampIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{from{transform:rotate(-8deg) scale(2.4);opacity:0}}
.escape-card h2{font-size:30px;margin:18px 0 8px}
.escape-card p{color:var(--muted);line-height:1.6}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0 22px}
.stars button{border:0;background:transparent;font-size:46px;color:#e5dccb;transition:.12s;line-height:1;padding:0 2px}
.stars button.on{color:var(--gold);text-shadow:0 4px 12px rgba(255,159,28,.45)}
.stars button{transition:transform .08s,color .08s}
.stars button:active{transform:scale(.9)}
.rate-msg{margin:-12px 0 18px;font-size:14px;font-weight:700;color:var(--muted);min-height:20px}
.credit{margin-top:26px;font-size:13.5px;color:rgba(255,255,255,.6)}
.credit b{color:var(--gold);font-weight:900}
.modal{position:fixed;inset:0;z-index:70;background:rgba(6,12,28,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.modal-card{background:var(--paper);border-radius:26px;padding:28px;max-width:560px;width:100%;max-height:90vh;overflow:auto;position:relative;animation:pop .25s}
.modal-card.wide{max-width:860px}
.modal-card h3{font-size:26px;margin-bottom:6px}

.bigtimer{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,#1d3a6e,#070f22);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px}
.bt-title{font-family:var(--display);font-size:clamp(22px,3vw,36px);opacity:.85}

.bt-digits.urgent{color:var(--coral);animation:pulse 1s infinite}

.bt-groups{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:900px}

.timeup{text-align:center}
.timeup .t-ico{font-size:90px;line-height:1;animation:ring .5s 4}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;padding:13px 20px;border-radius:16px;font-weight:700;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);animation:toastIn .25s;max-width:90vw;text-align:center}

/* ---------- awards ---------- */

.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;min-height:380px;margin-bottom:22px}
.pod{width:220px;display:flex;flex-direction:column;align-items:center}

.pod-emoji{font-size:72px;line-height:1}
.pod.pop .pod-emoji{animation:stampIn .6s cubic-bezier(.2,1.6,.4,1)}
.pod-name{font-family:var(--display);font-size:28px;margin-top:6px}
.pod-pts{font-weight:900;color:var(--gold);font-size:18px}
.pod-q{width:84px;height:84px;border-radius:50%;border:3px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-family:var(--display);font-size:44px;color:rgba(255,255,255,.4)}
.pod-block{width:100%;border-radius:20px 20px 6px 6px;display:grid;place-items:center;font-family:var(--display);color:rgba(0,0,0,.35);font-size:64px}
.pod1 .pod-block{height:200px;background:linear-gradient(180deg,#ffe08a,#f5b301)}
.pod2 .pod-block{height:150px;background:linear-gradient(180deg,#eef2f7,#b8c3d3)}

.reveal-bar{display:flex;justify-content:center;gap:10px;margin-bottom:28px;flex-wrap:wrap}
.specials{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:22px}
.special{background:var(--paper);border-radius:var(--r);padding:22px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow)}

.special p{margin:4px 0 0;color:var(--muted);font-size:14px}
.special .who{font-weight:900;font-size:18px;margin-top:6px}
table.rank{width:100%;border-collapse:collapse;font-size:15px}
table.rank th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line)}
table.rank td{padding:12px 10px;border-bottom:1px dashed var(--line)}
table.rank td.total{font-family:var(--display);font-size:22px}
.tbl-wrap{overflow-x:auto}

/* ---------- certificate ---------- */
.cert{background:#fffdf6;padding:16px;border-radius:8px;color:#2a2416}
.cert-inner{position:relative;border:3px solid #b8892c;outline:1px solid #b8892c;outline-offset:-10px;padding:56px 54px 46px;text-align:center;
  background:radial-gradient(circle at 50% 45%,rgba(255,193,69,.08),transparent 60%),repeating-linear-gradient(45deg,transparent 0 14px,rgba(184,137,44,.035) 14px 15px)}
.cert-corner{position:absolute;font-size:28px}
.cert-corner.tl{left:20px;top:16px}.cert-corner.tr{right:20px;top:16px}.cert-corner.bl{left:20px;bottom:16px}.cert-corner.br{right:20px;bottom:16px}
.cert-no{text-align:left;font-size:14px;color:#7a6a45}
.cert h1{font-family:var(--display);font-size:64px;letter-spacing:.5em;margin:10px 0 6px;padding-left:.5em;color:#3a2c0f}
.cert-award{display:inline-block;font-family:var(--display);font-size:28px;padding:6px 22px;border-radius:999px;background:linear-gradient(90deg,#ffe8a3,#ffd166);color:#5a3b00;margin-bottom:28px}
.cert-to{font-size:18px;text-align:left;margin:0 0 22px;line-height:1.8}
.cert-to b{font-family:var(--display);font-weight:400;font-size:34px;margin-left:8px}
.cert-body{font-size:20px;line-height:2;text-align:left;margin:0 0 30px;word-break:keep-all}
.cert-date{font-size:18px;margin-bottom:24px}
.cert-sign{font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:16px}
.seal{width:76px;height:76px;border-radius:50%;border:3px solid #d6332b;color:#d6332b;display:grid;place-items:center;font-family:var(--display);font-size:15px;line-height:1.1;transform:rotate(-10deg)}
.cert-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:16px}

@media print{
  body{background:#fff!important}
  body *{visibility:hidden!important}
  #cert,#cert *{visibility:visible!important}
  #cert{position:fixed;left:0;top:0;width:100%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 portrait;margin:12mm}
}

/* ---------- responsive ---------- */

  .make-grid,.play-grid{grid-template-columns:1fr}

}
@media (max-width:720px){
  .topbar{padding:10px 12px;gap:8px;flex-wrap:wrap}

  .stepper{order:3;width:100%;justify-content:space-between}
  .step{padding:6px 10px}
  .page{padding:18px 16px 60px}
  .hero,.role-grid{grid-template-columns:1fr}
  .hero-art{display:none}
  .setup-grid{grid-template-columns:1fr}
  .span2{grid-column:auto}

  .timer-bar{width:100%}

<body>
<header class="topbar">
  <div class="brand"><span class="logo">🗝️</span><div><b>지리 방탈출 메이커</b><small id="brand-sub">우리 반이 만드는 탈출 게임</small></div></div>
  <nav id="stepper" class="stepper" hidden></nav>
  <div class="tools">
    <span id="hdr-timer" class="hdr-timer" data-timer onclick="openBigTimer()" title="크게 보기" hidden></span>
    <button id="role-chip" class="role-chip" onclick="openMenu()" hidden></button>
    <button class="icon-btn" id="snd" onclick="toggleSound()" title="소리 켜기/끄기">🔊</button>
  </div>
</header>

<main id="app"></main>

<div id="bigtimer" class="bigtimer" hidden>
  <div class="bt-title" id="bt-title">문제 만들기 시간</div>
  <div class="bt-digits" data-timer>30:00</div>
  <div class="timer-bar"><i data-timer-bar></i></div>
  <div class="bt-groups" id="bt-groups"></div>
  <div class="bt-ctrl" id="bt-ctrl"></div>
</div>
<div id="modal" class="modal" hidden onclick="if(event.target===this)closeModal()"><div class="modal-card" id="modal-card"></div></div>
<canvas id="confetti"></canvas>

<!-- Code.gs 원본: '📋 Code.gs 복사' 버튼이 이 내용을 복사해요 (Code.gs를 고치면 여기도 같이 바꿔 주세요) -->
<script type="text/plain" id="src-code-gs">
/**
 * 지리 방탈출 메이커 — 구글 스프레드시트 연결용 Apps Script
 *
 * 1) 구글 스프레드시트를 새로 만들고  확장 프로그램 → Apps Script 를 엽니다.
 * 2) 이 파일 내용을 Code.gs 에 통째로 붙여넣습니다.
 * 3) 파일 ＋ → HTML → 이름을 Index 로 만들고, 지리방탈출메이커.html 내용을 붙여넣습니다.
 * 4) 배포 → 새 배포 → 웹 앱 (실행: 나, 액세스: 모든 사용자) → 나온 주소를 학생들에게 공유합니다.
 *
 * 교사 비밀번호는 아래 한 줄만 바꾸면 됩니다. (학생 화면 소스에는 들어가지 않아요)
 */
const TEACHER_PASSWORD = 'geodalrim';
const SERVER_VERSION = 4;   // 화면(HTML)이 이 번호로 Code.gs가 최신인지 확인해요

const TRIES = { ox: 1, mc: 2, short: 3, code: 3 };   // 문제 유형별 정답 기회
const TZ = 'Asia/Seoul';
const SH = {
  config:    ['설정',     ['항목', '값']],
  games:     ['게임목록', ['게임ID', '학급', '게임 이름', '출제 방식', '모둠 수', '만든 시각']],
  classes:   ['학급', ['학급', '게임ID', '게임 이름', '선생님', '진행 단계', '마지막 사용', '설정(JSON) — 직접 고치지 마세요']],
  questions: ['문제',     ['게임ID', '모둠ID', '모둠', '담당', '방 이름', '방 이야기', '번호', '문제ID', '유형', '문제',
                           '보기1', '보기2', '보기3', '보기4', '정답', '힌트', '점수', '이미지', '제출 시각']],
  images:    ['이미지',   ['게임ID', '모둠ID', '문제ID', '이미지 데이터']],
  records:   ['풀이기록', ['게임ID', '종류', '푼 모둠ID', '푼 모둠', '방 모둠ID', '방 모둠', '문제ID', '정답',
                           '점수·별점', '시도 횟수', '힌트', '입력한 답', '방식', '시각']]
};
const SCORE_HEAD = ['게임ID', '날짜', '게임 이름', '순위', '모둠', '담당', '푼 자물쇠', '정답 점수',
                    '받은 별점(평균)', '출제 보너스', '조정', '합계', '갱신 시각'];
const PHASE = { setup: '준비', make: '문제 만들기', play: '방탈출', awards: '시상식' };
const TYPE_KO = { mc: '객관식', short: '단답형', ox: 'OX', code: '숫자 자물쇠' };
const TARGETS = {
  asia: '아시아', europe: '유럽', africa: '아프리카', namerica: '북아메리카', samerica: '남아메리카', oceania: '오세아니아', polar: '극지방',
  climate: '기후', landform: '지형', population: '인구와 도시', resource: '자원과 산업', culture: '문화와 종교',
  capital: '국가와 수도', environment: '환경 문제', landmark: '세계의 랜드마크'
};

/* ---------------- 진입점 ---------------- */
function doGet() {
  // HTML 파일 이름이 조금 달라도 찾아요 (Index, index, 지리방탈출메이커 …)
  const names = ['Index', 'index', 'INDEX', 'Index.html', 'index.html', '지리방탈출메이커', '지리방탈출메이커.html', 'Page', 'page', 'Untitled', '제목 없음'];
  let out = null;
  for (let i = 0; i < names.length && !out; i++) {
    try { out = HtmlService.createHtmlOutputFromFile(names[i]); } catch (e) {}
  }
  if (!out) {
    return HtmlService.createHtmlOutput(
      '<div style="font-family:sans-serif;max-width:560px;margin:60px auto;line-height:1.7">' +
      '<h2>⚠️ 화면 파일(HTML)을 찾을 수 없어요</h2>' +
      '<p>Apps Script 편집기 왼쪽 <b>파일 ＋ → HTML</b>로 파일을 만들고 이름을 <b>Index</b>로 정한 뒤, ' +
      '<b>지리방탈출메이커.html</b> 내용을 붙여넣고 저장하세요.</p>' +
      '<p>그다음 <b>배포 → 배포 관리 → ✏️ → 버전: 새 버전 → 배포</b>를 눌러야 반영돼요.</p></div>')
      .setTitle('지리 방탈출 메이커 — 설정 필요');
  }
  return out
    .setTitle('지리 방탈출 메이커')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}
function doPost(e) {
  let req = {};
  try { req = JSON.parse(e.postData.contents); } catch (err) {}
  return ContentService.createTextOutput(JSON.stringify(api(req))).setMimeType(ContentService.MimeType.JSON);
}
/** 웹 앱 화면(google.script.run)과 doPost 모두 이 함수를 거칩니다. */
function api(req) {
  try {
    req = req || {};
    const fn = ACTIONS[req.action];
    if (!fn) throw new Error('알 수 없는 요청이에요');
    const res = fn(req) || {};
    res.ok = true;
    res.serverTime = Date.now();
    res.v = SERVER_VERSION;
    return res;
  } catch (err) {
    return { ok: false, error: String((err && err.message) || err), serverTime: Date.now(), v: SERVER_VERSION };
  }
}

const ACTIONS = {
  teacherLogin(req) { needTeacher(req); return {}; },
  /** 학생 입장: 선생님 화면의 4자리 입장 코드 확인 */
  join(req) {
    const cfg = needConfig();
    if (!codeOk(cfg, req)) throw new Error('입장 코드가 맞지 않아요');
    return { title: cfg.title, klass: cfg.klass };
  },
  /** 모둠 입장: 모둠 비밀번호 확인 */
  joinGroup(req) {
    const cfg = needConfig();
    needCode(cfg, req);
    needGroup(cfg, req);
    return {};
  },
  /** 교사: 모둠 비밀번호 새로 만들기 (group 없으면 모든 모둠) */
  newGroupPin(req) {
    needTeacher(req);
    return withLock(() => {
      const cfg = needConfig();
      cfg.groups.forEach(g => { if (!req.group || g.id === req.group) g.pin = newCode(g.pin); });
      putConfig(cfg);
      return { config: cfg };
    });
  },
  newCode(req) {
    needTeacher(req);
    return withLock(() => {
      const cfg = needConfig();
      cfg.joinCode = newCode(cfg.joinCode);
      putConfig(cfg);
      return { config: cfg };
    });
  },
  getState: getState,
  saveConfig(req) {
    needTeacher(req);
    return withLock(() => {
      const cur = getConfig();
      const cfg = cleanConfig(req.config);
      cfg.gameId = cur ? cur.gameId : newId('G');
      cfg.createdAt = cur ? cur.createdAt : Date.now();
      cfg.rev = cur ? cur.rev : 0;
      cfg.joinCode = cur && cur.joinCode ? cur.joinCode : newCode();
      cfg.groups.forEach(g => {                         // 모둠 비밀번호는 서버에 있는 것을 유지, 새 모둠만 새로 만들어요
        const old = cur && cur.groups.find(x => x.id === g.id);
        g.pin = old && old.pin ? old.pin : newCode();
      });
      putConfig(cfg);
      return { config: cfg, classes: listClasses() };
    });
  },
  /** 저장된 학급 목록 */
  listClasses(req) { needTeacher(req); return { classes: listClasses() }; },
  /** 저장된 학급으로 바꾸기: 그 학급의 모둠·문제·점수·입장 코드가 그대로 돌아와요 */
  switchClass(req) {
    needTeacher(req);
    return withLock(() => {
      const row = rowsOf(getSheet('classes'), 7).find(r => String(r[0]) === String(req.klass));
      if (!row) throw new Error('저장된 학급을 찾을 수 없어요');
      const cfg = JSON.parse(String(row[6]));
      if (cfg.timer && cfg.timer.running) {               // 다른 반 타이머는 멈춘 상태로 가져와요
        cfg.timer.remaining = Math.max(0, (cfg.timer.endAt - Date.now()) / 1000);
        cfg.timer.running = false;
      }
      if (!cfg.joinCode) cfg.joinCode = newCode();
      cfg.groups.forEach(g => { if (!g.pin) g.pin = newCode(); });
      putConfig(cfg);
      return { config: cfg, classes: listClasses() };
    });
  },
  /** 저장된 학급 지우기 (purge면 그 학급의 문제·사진·풀이 기록도 지워요. 점수판 탭은 남겨요) */
  deleteClass(req) {
    needTeacher(req);
    return withLock(() => {
      const cur = getConfig();
      const sh = getSheet('classes');
      const row = rowsOf(sh, 7).find(r => String(r[0]) === String(req.klass));
      if (!row) throw new Error('저장된 학급을 찾을 수 없어요');
      if (cur && String(row[1]) === cur.gameId) throw new Error('지금 사용 중인 학급은 지울 수 없어요. 다른 학급으로 바꾼 뒤 지워 주세요');
      const gid = String(row[1]);
      deleteWhere(sh, 7, r => String(r[0]) === String(req.klass));
      if (req.purge) {
        deleteWhere(getSheet('questions'), SH.questions[1].length, r => String(r[0]) === gid);
        deleteWhere(getSheet('images'), 4, r => String(r[0]) === gid);
        deleteWhere(getSheet('records'), SH.records[1].length, r => String(r[0]) === gid);
        setProp('roomsRev:' + gid, String(Number(getProp('roomsRev:' + gid) || 0) + 1));
        bumpRecs(gid);
      }
      return { classes: listClasses() };
    });
  },
  newGame(req) {
    needTeacher(req);
    return withLock(() => {
      const old = getConfig();
      const cfg = cleanConfig(req.config);
      cfg.joinCode = newCode(old && old.joinCode);    // 새 게임(다른 반)은 새 입장 코드
      cfg.groups.forEach(g => { g.pin = newCode(); });  // 모둠 비밀번호도 새로
      cfg.gameId = newId('G');
      cfg.createdAt = Date.now();
      cfg.rev = 0;
      cfg.phase = 'setup';
      cfg.timer = { total: cfg.settings.makeMin * 60, remaining: cfg.settings.makeMin * 60, running: false, endAt: 0 };
      putConfig(cfg);
      return { config: cfg, classes: listClasses() };
    });
  },
  submitRoom: submitRoom,
  answer: answerQuestion,
  rate(req) {
    const cfg = needConfig();
    const teacher = isTeacher(req);
    if (!teacher) { needCode(cfg, req); needGroup(cfg, req); }
    if (!teacher && cfg.phase !== 'play') throw new Error('지금은 별점을 줄 수 없어요');
    const rater = teacher ? 'teacher' : String(req.group || '');
    if (!teacher && !findGroup(cfg, rater)) throw new Error('모둠을 먼저 골라 주세요');
    if (rater === req.room) throw new Error('자기 모둠 방에는 별점을 줄 수 없어요');
    if (!findGroup(cfg, req.room)) throw new Error('방을 찾을 수 없어요');
    const stars = Math.max(1, Math.min(5, Math.round(Number(req.stars) || 0)));
    withLock(() => upsertRecords(cfg, [{ t: 'star', s: rater, r: String(req.room), q: '', c: false, p: stars, a: 0, h: false, src: teacher ? 'teacher' : 'student', inp: '' }]));
    return {};
  },
  award(req) {
    needTeacher(req);
    const cfg = needConfig();
    const room = loadRooms(cfg.gameId)[req.room];
    const q = room && room.questions.find(x => x.id === req.qid);
    if (!q) throw new Error('문제를 찾을 수 없어요');
    const pts = pointsFor(cfg, q, !!req.hint);
    const winners = (req.winners || []).map(String);
    withLock(() => {
      const recs = loadRecords(cfg.gameId);
      const list = [];
      cfg.groups.forEach(g => {
        if (g.id === req.room) return;
        const ex = recs.find(r => r.t === 'solve' && r.s === g.id && r.q === q.id);
        if (winners.indexOf(g.id) >= 0) {
          if (ex && ex.c && ex.src === 'student') return;          // 기기에서 이미 맞힌 기록은 그대로
          list.push({ t: 'solve', s: g.id, r: req.room, q: q.id, c: true, p: pts, a: ex ? ex.a : 0, h: !!req.hint, src: 'teacher', inp: '' });
        } else if (ex && ex.src === 'teacher' && ex.c) {
          list.push({ t: 'solve', s: g.id, r: req.room, q: q.id, c: false, p: 0, a: ex.a, h: ex.h, src: 'teacher', inp: '' });
        }
      });
      upsertRecords(cfg, list);
    });
    return {};
  },
  adjust(req) {
    needTeacher(req);
    const cfg = needConfig();
    if (!findGroup(cfg, req.group)) throw new Error('모둠을 찾을 수 없어요');
    withLock(() => {
      const ex = loadRecords(cfg.gameId).find(r => r.t === 'adjust' && r.s === req.group);
      upsertRecords(cfg, [{ t: 'adjust', s: req.group, r: '', q: '', c: false, p: (ex ? ex.p : 0) + (Number(req.delta) || 0), a: 0, h: false, src: 'teacher', inp: '' }]);
    });
    return {};
  },
  resetPlay(req) {
    needTeacher(req);
    const cfg = needConfig();
    withLock(() => {
      deleteWhere(getSheet('records'), SH.records[1].length, r => String(r[0]) === cfg.gameId);
      bumpRecs(cfg.gameId);
      setProp('dirty:' + cfg.gameId, '1');
    });
    return {};
  },
  saveScores(req) {
    needTeacher(req);
    const cfg = needConfig();
    withLock(() => syncScoreSheet(cfg, computeScores(cfg, loadRecords(cfg.gameId))));
    return {};
  },
  getImage(req) {
    const cfg = needConfig();
    if (!isTeacher(req)) needCode(cfg, req);
    const key = 'img:' + cfg.gameId + ':' + req.qid;
    const hit = cache().get(key);
    if (hit) return { data: hit };
    const row = rowsOf(getSheet('images'), 4).find(r => String(r[0]) === cfg.gameId && String(r[2]) === String(req.qid));
    const data = row ? String(row[3]) : '';
    if (data) try { cache().put(key, data, 21600); } catch (e) {}
    return { data: data };
  }
};

/* ---------------- 상태 읽기 ---------------- */
function getState(req) {
  const cfg = getConfig();
  if (!cfg) return { config: null };
  const teacher = isTeacher(req);
  if (!teacher && !codeOk(cfg, req)) return { config: null, needCode: true };   // 입장 코드 없이는 아무것도 안 보여 줘요
  const gid = cfg.gameId;
  const rooms = loadRooms(gid);
  const roomsRev = Number(getProp('roomsRev:' + gid) || 0);
  const recs = loadRecords(gid);
  const status = {};
  cfg.groups.forEach(g => {
    const r = rooms[g.id];
    status[g.id] = { count: r ? r.questions.length : 0, at: r ? r.submittedAt : '' };
  });
  const out = { config: teacher ? cfg : publicConfig(cfg), status: status, scores: computeScores(cfg, recs), roomsRev: roomsRev };
  const fresh = Number(req.roomsRev) !== roomsRev || req.roomsFor !== (req.group || '') + cfg.phase;
  if (teacher) {
    if (fresh) out.rooms = rooms;
    out.records = recs;
    out.classes = listClasses();
    try { out.appUrl = ScriptApp.getService().getUrl(); } catch (e) {}   // QR 코드에 넣을 웹 앱 주소
    if (getProp('dirty:' + gid)) {                    // 점수가 바뀌었으면 학급 점수판 탭에 기록
      const lock = LockService.getScriptLock();
      if (lock.tryLock(200)) {
        try { syncScoreSheet(cfg, out.scores); delProp('dirty:' + gid); } catch (e) {} finally { lock.releaseLock(); }
      }
    }
  } else {
    let g = String(req.group || '');
    if (g && !groupOk(cfg, req)) { out.badGroup = true; g = ''; }   // 모둠 비밀번호가 틀리면 그 모둠 내용은 안 보여 줘요
    if (cfg.phase === 'setup' || cfg.phase === 'make') {
      if (fresh && g && rooms[g]) out.myRoom = rooms[g];
    } else if (fresh) {
      out.rooms = sanitizeRooms(rooms);
    }
    if (g) {
      out.myRecords = recs.filter(r => r.s === g).map(r => {
        if (r.t !== 'solve') return r;
        const q = rooms[r.r] && rooms[r.r].questions.find(x => x.id === r.q);
        const done = r.c || (q && r.a >= (TRIES[q.type] || 3));
        return done && q ? Object.assign({}, r, { ans: answerText(q) }) : r;
      });
    }
  }
  return out;
}

/* ---------------- 출제 ---------------- */
function submitRoom(req) {
  const cfg = needConfig();
  const teacher = isTeacher(req);
  if (!teacher) { needCode(cfg, req); needGroup(cfg, req); }
  if (!teacher && cfg.phase !== 'make') throw new Error(cfg.phase === 'setup' ? '아직 출제 시간이 아니에요' : '출제가 마감되어 더 이상 보낼 수 없어요');
  const g = findGroup(cfg, req.group);
  if (!g) throw new Error('모둠을 찾을 수 없어요');
  const room = req.room || {};
  const qs = (room.questions || []).slice(0, 30);
  // base: 이 기기가 마지막으로 불러오거나 보낸 시점에 시트에 있던 자물쇠 ID들 (여러 기기 합치기용)
  const base = Array.isArray(req.base) ? req.base.map(String) : null;
  if (!qs.length && !base) throw new Error('자물쇠(문제)가 하나도 없어요');
  qs.forEach((q, i) => {
    q.id = safeId(q.id) || newId('q');
    if (!TYPE_KO[q.type]) q.type = 'short';
    if (q.type === 'ox') q.answer = oxNorm(q.answer);
    const w = qWarn(q);
    if (w) throw new Error('자물쇠 ' + (i + 1) + ': ' + w);
    if (String(q.image || '').indexOf('data:') === 0 && String(q.image).length > 49000) throw new Error('자물쇠 ' + (i + 1) + ': 사진이 너무 커요');
  });
  return withLock(() => {
    const now = fmtTime(Date.now());
    const prev = loadRooms(cfg.gameId)[g.id] || { title: '', story: '', questions: [] };
    const final = mergeQuestions(prev.questions, qs, base);
    if (!final.length) throw new Error('자물쇠(문제)가 하나도 없어요');
    if (final.length > 30) throw new Error('자물쇠는 모둠당 30개까지 만들 수 있어요');
    const title = String(room.title || '').trim() ? String(room.title) : prev.title;
    const story = String(room.story || '').trim() ? String(room.story) : prev.story;
    const qsh = getSheet('questions'), ish = getSheet('images');
    const mine = r => String(r[0]) === cfg.gameId && String(r[1]) === g.id;
    const oldImg = {};
    rowsOf(ish, 4).forEach(r => { if (mine(r)) oldImg[String(r[2])] = String(r[3]); });
    deleteWhere(qsh, SH.questions[1].length, mine);
    deleteWhere(ish, 4, mine);
    const imgRows = [];
    const outQs = [];
    const rows = final.map((q, i) => {
      let img = String(q.image || '');
      if (img.indexOf('data:') === 0) { imgRows.push([cfg.gameId, g.id, q.id, img]); img = '@img'; }
      else if (img === '@img') { if (oldImg[q.id]) imgRows.push([cfg.gameId, g.id, q.id, oldImg[q.id]]); else img = ''; }
      if (String(q.image || '').indexOf('data:') === 0) cache().remove('img:' + cfg.gameId + ':' + q.id);
      const optsRaw = (q.options || []).concat(['', '', '', '']).slice(0, 4).map(o => String(o == null ? '' : o));
      const pts = q.points === '' || q.points == null ? '' : (Number(q.points) || '');
      outQs.push({ id: q.id, type: q.type, prompt: String(q.prompt || ''), options: optsRaw, answer: String(q.answer), hint: String(q.hint || ''), points: pts, image: img });
      return [cfg.gameId, g.id, g.name, targetName(g), txt(title), txt(story), i + 1, q.id,
        q.type, txt(String(q.prompt || ''))].concat(optsRaw.map(txt), [txt(String(q.answer)), txt(String(q.hint || '')), pts, img, now]);
    });
    appendRows(qsh, rows);
    appendRows(ish, imgRows);
    setProp('roomsRev:' + cfg.gameId, String(Number(getProp('roomsRev:' + cfg.gameId) || 0) + 1));
    return { submittedAt: now, count: rows.length, room: { title: title, story: story, submittedAt: now, questions: outQs } };
  });
}
/**
 * 같은 모둠의 여러 기기에서 보낸 자물쇠를 합쳐요.
 * - 시트의 순서를 지키고, 새 자물쇠는 올라온 순서대로 뒤에 붙여요. 이 기기에서 지운 자물쇠는 빠져요.
 * - 이 기기가 시트의 자물쇠를 모두 알고 있고(불러온 뒤) 순서를 직접 바꿨다면, 그 순서를 그대로 써요.
 */
function mergeQuestions(prevQs, incoming, base) {
  const inIds = incoming.map(q => q.id), prevIds = prevQs.map(q => q.id);
  if (!base) return incoming.slice();                      // 예전 방식: 통째로 바꾸기
  const removed = base.filter(id => inIds.indexOf(id) < 0);  // 이 기기에서 지운 자물쇠
  const knowsAll = prevIds.every(id => base.indexOf(id) >= 0 || inIds.indexOf(id) >= 0);
  const reordered = inIds.filter(id => base.indexOf(id) >= 0).join('|') !== base.filter(id => inIds.indexOf(id) >= 0).join('|');
  if (knowsAll && reordered) return incoming.slice();
  const byId = {};
  incoming.forEach(q => { byId[q.id] = q; });
  const out = prevQs.filter(q => removed.indexOf(q.id) < 0).map(q => byId[q.id] || q);
  incoming.forEach(q => { if (prevIds.indexOf(q.id) < 0) out.push(q); });
  return out;
}

/* ---------------- 풀이 ---------------- */
function answerQuestion(req) {
  const cfg = needConfig();
  needCode(cfg, req);
  needGroup(cfg, req);
  if (cfg.phase !== 'play') throw new Error('지금은 문제를 풀 수 없어요');
  const solver = String(req.group || '');
  if (!findGroup(cfg, solver)) throw new Error('모둠을 먼저 골라 주세요');
  if (solver === req.room) throw new Error('자기 모둠 방은 풀 수 없어요');
  const room = loadRooms(cfg.gameId)[req.room];
  const q = room && room.questions.find(x => x.id === req.qid);
  if (!q) throw new Error('문제를 찾을 수 없어요');
  const max = TRIES[q.type] || 3;
  return withLock(() => {
    const ex = loadRecords(cfg.gameId).find(r => r.t === 'solve' && r.s === solver && r.q === q.id);
    if (ex && (ex.c || ex.a >= max)) {
      return { record: Object.assign({}, ex, { ans: answerText(q) }), correct: ex.c, done: true, left: 0 };
    }
    const ok = isCorrect(q, req.answer);
    const a = (ex ? ex.a : 0) + 1;
    const rec = { t: 'solve', s: solver, r: String(req.room), q: q.id, c: ok, p: ok ? pointsFor(cfg, q, !!req.hint) : 0, a: a, h: !!req.hint, src: 'student', inp: String(req.answer == null ? '' : req.answer).slice(0, 100) };
    upsertRecords(cfg, [rec]);
    const done = ok || a >= max;
    if (done) rec.ans = answerText(q);
    return { record: rec, correct: ok, done: done, left: Math.max(0, max - a) };
  });
}
function isCorrect(q, input) {
  const ans = String(q.answer);
  if (q.type === 'mc') return String(input) === ans;
  if (q.type === 'ox') return oxNorm(input) === oxNorm(ans);
  if (q.type === 'code') return String(input).replace(/\D/g, '') === ans.replace(/\D/g, '') && ans.replace(/\D/g, '') !== '';
  return ans.split(/[,|]/).map(norm).filter(Boolean).indexOf(norm(input)) >= 0;
}
function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/[\s.,·\-_'"()!?~]/g, ''); }
function oxNorm(s) {
  const v = String(s == null ? '' : s).trim().toUpperCase();
  if (['O', 'ㅇ', '○', '◯', 'TRUE', '참', '맞다', '맞음'].indexOf(v) >= 0) return 'O';
  if (['X', 'ㅌ', '×', '✕', '✖', 'FALSE', '거짓', '틀리다', '틀림'].indexOf(v) >= 0) return 'X';
  return v;
}
function qWarn(q) {
  if (!String(q.prompt || '').trim()) return '문제 내용이 비어 있어요';
  if (q.type === 'mc') {
    const o = q.options || [];
    if (o.filter(x => String(x || '').trim()).length < 2) return '보기를 2개 이상 써 주세요';
    if (String(q.answer) === '' || !String(o[Number(q.answer)] || '').trim()) return '정답 보기를 골라 주세요';
  } else if (q.type === 'ox') {
    if (['O', 'X'].indexOf(oxNorm(q.answer)) < 0) return 'O 또는 X 정답을 골라 주세요';
  } else if (q.type === 'code') {
    if (!String(q.answer).replace(/\D/g, '')) return '숫자 비밀번호를 정해 주세요';
  } else if (!String(q.answer || '').trim()) return '정답을 정해 주세요';
  return '';
}
function answerText(q) {
  if (q.type === 'mc') return (Number(q.answer) + 1) + '번 ' + (q.options[Number(q.answer)] || '');
  if (q.type === 'short') return String(q.answer).split(/[,|]/)[0].trim();
  return String(q.answer);
}
function pointsFor(cfg, q, hint) {
  const base = Number(q.points) || cfg.settings.points;
  return Math.round(base * (hint ? cfg.settings.hintRate / 100 : 1));
}
function sanitizeRooms(rooms) {
  const out = {};
  Object.keys(rooms).forEach(k => {
    const r = rooms[k];
    out[k] = {
      title: r.title, story: r.story, submittedAt: r.submittedAt,
      questions: r.questions.map(q => ({ id: q.id, type: q.type, prompt: q.prompt, options: q.type === 'mc' ? q.options : [], hint: q.hint, points: q.points, image: q.image, tries: TRIES[q.type] || 3 }))
    };
  });
  return out;
}

/* ---------------- 점수 ---------------- */
function computeScores(cfg, recs) {
  const m = {};
  cfg.groups.forEach(g => { m[g.id] = { id: g.id, ans: 0, correct: 0, starSum: 0, starN: 0, adj: 0 }; });
  recs.forEach(r => {
    if (r.t === 'solve' && r.c && m[r.s] && r.s !== r.r) { m[r.s].ans += r.p; m[r.s].correct++; }
    else if (r.t === 'star' && m[r.r]) { m[r.r].starSum += r.p; m[r.r].starN++; }
    else if (r.t === 'adjust' && m[r.s]) { m[r.s].adj += r.p; }
  });
  const list = cfg.groups.map(g => {
    const x = m[g.id], avg = x.starN ? x.starSum / x.starN : 0;
    const bonus = Math.round(avg * cfg.settings.starBonus);
    return { id: g.id, ans: x.ans, correct: x.correct, stars: Math.round(avg * 10) / 10, raters: x.starN, star: bonus, adj: x.adj, total: x.ans + bonus + x.adj };
  });
  list.sort((a, b) => b.total - a.total || b.correct - a.correct);
  list.forEach((x, i) => { x.rank = i && list[i - 1].total === x.total && list[i - 1].correct === x.correct ? list[i - 1].rank : i + 1; });
  return list;
}
function syncScoreSheet(cfg, scores) {
  const name = ('점수판_' + (cfg.klass || '학급미지정')).replace(/[:\\\/?*\[\]]/g, ' ').slice(0, 90);
  const sh = ensureSheet(name, SCORE_HEAD);
  deleteWhere(sh, SCORE_HEAD.length, r => String(r[0]) === cfg.gameId);
  const now = fmtTime(Date.now()), day = Utilities.formatDate(new Date(cfg.createdAt || Date.now()), TZ, 'yyyy-MM-dd');
  appendRows(sh, scores.map(x => {
    const g = findGroup(cfg, x.id);
    return [cfg.gameId, day, txt(cfg.title || ''), x.rank, g.emoji + ' ' + g.name, targetName(g), x.correct, x.ans, x.stars, x.star, x.adj, x.total, now];
  }));
}

/* ---------------- 기록 저장 ---------------- */
function loadRecords(gid) {
  const key = 'recs:' + gid + ':' + (getProp('recsRev:' + gid) || 0);
  const hit = cache().get(key);
  if (hit) return JSON.parse(hit);
  const recs = rowsOf(getSheet('records'), SH.records[1].length).filter(r => String(r[0]) === gid).map(r => ({
    t: String(r[1]), s: String(r[2]), r: String(r[4]), q: String(r[6]), c: String(r[7]) === 'O',
    p: Number(r[8]) || 0, a: Number(r[9]) || 0, h: String(r[10]) === 'O', src: String(r[12])
  }));
  try { cache().put(key, JSON.stringify(recs), 600); } catch (e) {}
  return recs;
}
/** 같은 (종류, 푼 모둠, 방, 문제) 기록이 있으면 덮어쓰고 없으면 추가. withLock 안에서 부르세요. */
function upsertRecords(cfg, list) {
  if (!list.length) return;
  const sh = getSheet('records'), W = SH.records[1].length;
  const rows = rowsOf(sh, W);
  const key = (t, s, r, q) => [cfg.gameId, t, s, r, q].join('|');
  const index = {};
  rows.forEach((r, i) => { index[key(String(r[1]), String(r[2]), String(r[4]), String(r[6]))] = i + 2; });
  const now = fmtTime(Date.now()), add = [];
  list.forEach(x => {
    const row = [cfg.gameId, x.t, x.s, groupName(cfg, x.s), x.r, groupName(cfg, x.r), x.q,
      x.t === 'solve' ? (x.c ? 'O' : 'X') : '', x.p, x.a, x.h ? 'O' : '', txt(x.inp || ''), x.src, now];
    const at = index[key(x.t, x.s, x.r, x.q)];
    if (at) sh.getRange(at, 1, 1, W).setValues([row]); else add.push(row);
  });
  appendRows(sh, add);
  bumpRecs(cfg.gameId);
  setProp('dirty:' + cfg.gameId, '1');
}

/* ---------------- 설정 ---------------- */
function getConfig() {
  const hit = cache().get('cfg');
  if (hit) return JSON.parse(hit);
  const sh = getSheet('config');
  const v = sh.getLastRow() >= 2 ? String(sh.getRange(2, 2).getValue() || '') : '';
  const cfg = v ? JSON.parse(v) : null;
  if (cfg && (!cfg.joinCode || cfg.groups.some(g => !g.pin))) {          // 예전 게임에도 입장 코드·모둠 비밀번호 붙이기
    if (!cfg.joinCode) cfg.joinCode = newCode();
    cfg.groups.forEach(g => { if (!g.pin) g.pin = newCode(); });
    putConfig(cfg);
  }
  if (cfg) cache().put('cfg', JSON.stringify(cfg), 600);
  return cfg;
}
function putConfig(cfg) {
  cfg.updatedAt = Date.now();
  cfg.rev = (cfg.rev || 0) + 1;
  const sh = getSheet('config');
  const rows = [
    ['게임 데이터(JSON) — 직접 고치지 마세요', JSON.stringify(cfg)],
    ['게임ID', cfg.gameId], ['학생 입장 코드', txt(String(cfg.joinCode || ''))], ['학급', txt(cfg.klass || '')], ['게임 이름', txt(cfg.title || '')],
    ['진행 단계', PHASE[cfg.phase] || cfg.phase], ['모둠', cfg.groups.map(g => g.name + '(' + targetName(g) + ')').join(', ')],
    ['모둠 비밀번호', cfg.groups.map(g => g.name + ' ' + (g.pin || '')).join(' / ')],
    ['마지막 갱신', fmtTime(cfg.updatedAt)]
  ];
  sh.getRange(2, 1, rows.length, 2).setValues(rows);
  cache().put('cfg', JSON.stringify(cfg), 600);
  const gs = getSheet('games'), W = SH.games[1].length;
  const row = [cfg.gameId, txt(cfg.klass || ''), txt(cfg.title || ''), cfg.mode === 'topic' ? '주제별' : '대륙별', cfg.groups.length, fmtTime(cfg.createdAt)];
  const i = rowsOf(gs, W).findIndex(r => String(r[0]) === cfg.gameId);
  if (i >= 0) gs.getRange(i + 2, 1, 1, W).setValues([row]); else appendRows(gs, [row]);

    'ㄳ':'rt','ㄵ':'sw','ㄶ':'sg','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅄ':'qt'};
  const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ', JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
  const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

const sfx={right(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',i*.08))},wrong(){tone(196,.25,'sawtooth',0,.12);tone(147,.35,'sawtooth',.18,.12)},click(){tone(880,.05,'square',0,.06)},
  alarm(){for(let i=0;i<5;i++){tone(988,.14,'square',i*.36,.1);tone(784,.14,'square',i*.36+.18,.1)}},
  fanfare(){[[523,0],[523,.12],[523,.24],[659,.36],[784,.6],[659,.78],[784,.9],[1047,1.05]].forEach(([f,t])=>tone(f,.28,'triangle',t,.16))},tick(){tone(1200,.04,'sine',0,.05)}};

function confetti(n=180){const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#ffc145','#ff6b6b','#22c3a0','#4dabf7','#9b5de5','#f15bb5','#fff'];
  const ps=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:(Math.random()-.5)*5,vy:2+Math.random()*4,r:6+Math.random()*7,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(t-t0<4500)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0)}

function joinUrl(){
  // GitHub Pages 등에 올려 쓰면 "그 페이지 주소 + 서버 정보"를, Apps Script 웹 앱으로 쓰면 웹 앱 주소를 QR에 넣어요
  const inGas=!!(window.google&&google.script&&google.script.run);
  if(!inGas&&/^https?:/.test(location.href)&&!/googleusercontent|script\.google\.com/.test(location.host)){
    const api=apiUrl(),id=execId(api);
    return location.origin+location.pathname+(id?'?s='+id:api?'?api='+encodeURIComponent(api):'');
  }
  return APPURL||apiUrl()||'';
}
function drawQR(el,size){if(!el)return;const url=joinUrl();el.innerHTML='';
  if(!url||!window.QRCode){el.innerHTML='<div class="qr-none">QR을 만들 수 없어요<br><small>웹 앱 주소로 열면 표시돼요</small></div>';return}
  try{new QRCode(el,{text:url,width:size,height:size,colorDark:'#1b2340',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent=''}}
function joinCard(){
  if(!CFG.joinCode)return '';
  return `<section class="join-card"><div class="qr" id="qr-small"></div>
    <div class="jc-text"><span class="eyebrow">🧑‍🎓 학생 입장</span><div class="jc-code">${CFG.joinCode.split('').join(' ')}</div>
      <p>① 태블릿 카메라로 QR 찍기 → ② <b>🧑‍🎓 학생</b> 누르기 → ③ 입장 코드 입력</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" onclick="openJoinScreen()">⛶ 칠판에 크게 띄우기</button><button class="btn glass sm" onclick="regenCode()">🔄 코드 바꾸기</button>${joinUrl()?`<button class="btn glass sm" onclick="copyJoinUrl()">🔗 주소 복사</button>`:''}</div></div></section>`;
}
function openJoinScreen(){
  $('#bt-title').textContent=(CFG.klass?CFG.klass+' · ':'')+(CFG.title||'지리 방탈출');
  const box=$('#bigtimer');box.classList.add('join-mode');
  $('#bt-groups').innerHTML=`<div class="join-big"><div class="qr-big" id="qr-big"></div><div><div class="jb-label">입장 코드</div><div class="jb-code">${CFG.joinCode}</div>
    <ol class="jb-steps"><li>카메라로 QR 코드 찍기</li><li><b>🧑‍🎓 학생</b> 누르기</li><li>입장 코드 <b>${CFG.joinCode}</b> 입력</li></ol></div></div>`;
  $('#bt-ctrl').innerHTML=`<button class="btn glass big" onclick="closeBigTimer()">✕ 닫기</button>`;
  box.hidden=false;drawQR($('#qr-big'),300);

async function regenCode(){if(!confirm('입장 코드를 새로 만들까요? 이미 들어온 학생들도 새 코드를 다시 입력해야 해요.'))return;

function copyJoinUrl(){const u=joinUrl();if(!u)return;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('🔗 학생용 주소를 복사했어요 (클래스룸 등에 올려 주세요)','good')).catch(()=>prompt('이 주소를 복사하세요',u))}
/* 한/영 키가 한글로 되어 있어도(예: ㅎ댕미갸ㅡ) 영문 자판 글자로 바꿔서 확인해요 */
const KO_KEY={'ㄱ':'r','ㄲ':'R','ㄴ':'s','ㄷ':'e','ㄸ':'E','ㄹ':'f','ㅁ':'a','ㅂ':'q','ㅃ':'Q','ㅅ':'t','ㅆ':'T','ㅇ':'d','ㅈ':'w','ㅉ':'W','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
  'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'O','ㅓ':'j','ㅔ':'p','ㅕ':'u','ㅖ':'P','ㅗ':'h','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl','ㅛ':'y','ㅜ':'n','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅠ':'b','ㅡ':'m','ㅢ':'ml','ㅣ':'l',
  'ㄳ':'rt','ㄵ':'sw','ㄶ':'sg','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq','ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅄ':'qt'};
const KO_CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',KO_JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',KO_JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function koToEn(s){return [...String(s)].map(ch=>{const c=ch.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3){const i=c-0xAC00;return KO_KEY[KO_CHO[Math.floor(i/588)]]+KO_KEY[KO_JUNG[Math.floor(i%588/28)]]+(i%28?KO_KEY[KO_JONG[i%28]]:'')}return KO_KEY[ch]||ch}).join('')}
const normPw=s=>koToEn(String(s||'').replace(/\s+/g,'')).toLowerCase();

    <div class="pw-row"><input class="inp" id="pw-in" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')loginTeacher()" onkeyup="capsWarn(event)" autocomplete="off" autocapitalize="off" spellcheck="false">

    ${t?`<button onclick="closeModal();setTimeout(openHelper,50)"><span>🔧</span><div>설정 도우미${SERVER_V&&SERVER_V<NEED_SERVER_V?' ⚠️':''}<small>Code.gs 복사 · 구글 시트 연결 주소 바꾸기 · 처음 설정 안내</small></div></button>`:''}

  </div>`);
}
